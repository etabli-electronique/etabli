<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e4e8e4; --panel:#f4f6f3; --panel-2:#e9ede8; --ink:#1c231f; --ink-2:#4f5b54; --ink-3:#77827b;

  --copper:#b0602a; --copper-ink:#fff; --copper-soft:rgba(176,96,42,.12);
  --err:#b3261e; --warn:#94570a; --tip:#2a5d8c; --ok:#2c7448;

}

    --copper:#e0904f; --copper-ink:#1d1208; --copper-soft:rgba(224,144,79,.14);
    --err:#ff8f86; --warn:#f0b65e; --tip:#93c0ef; --ok:#86d4a4; --shadow:0 8px 30px rgba(0,0,0,.5);
    --paper:#1a201d; --grid-a:rgba(255,255,255,.035); --grid-b:rgba(255,255,255,.08); --svg-ink:#e3e9e5; --svg-ink2:#a4afa8;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121715; --panel:#19201c; --panel-2:#222a26; --ink:#e3e9e5; --ink-2:#a4afa8; --ink-3:#7c8881;
  --line:#2f3a34; --mat:#1b392e; --mat-a:rgba(255,255,255,.05); --mat-b:rgba(255,255,255,.12);

  --err:#ff8f86; --warn:#f0b65e; --tip:#93c0ef; --ok:#86d4a4; --shadow:0 8px 30px rgba(0,0,0,.5);

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.cond{font-family:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif}

/* Barre du haut */
.top{display:flex;align-items:center;gap:8px 12px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:8px;font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:18px;letter-spacing:.01em;white-space:nowrap}
.brand svg{flex:none}
button.brand{border:0;background:none;color:inherit;padding:4px 6px;margin:-4px -6px;border-radius:8px;cursor:pointer}
button.brand:hover{background:var(--panel-2)}
.stage-wm{position:absolute;left:22px;top:62px;width:150px;height:150px;color:var(--svg-ink2,#888);opacity:.16;pointer-events:none;z-index:0}
.stage-wm svg{width:100%;height:100%;display:block}
/* Le filigrane reste sous le plan ; les commandes posées sur l’établi restent toujours au-dessus. */
.stage>.zoom,.stage>.posbar,.stage>.now-float,.stage>.legend,.stage>.stage-hint{z-index:5}
body.nfs-touch .stage-wm{top:134px}
.about{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:24px;align-items:center}
.about-logo{width:100%;height:auto;color:var(--copper);display:block}
.about-t h3{font-size:22px;margin:0 0 8px}
.about-t p{margin:0 0 10px;line-height:1.5}
.about-sig{font-weight:600}.about-sig span{display:block;font-weight:400;font-size:13px;color:var(--ink-3)}
@media (max-width:640px){.about{grid-template-columns:1fr}.about-logo{max-width:160px;margin:0 auto}}
.pname{min-width:0;width:220px;max-width:30vw;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 8px;font-weight:600}
.pname:hover,.pname:focus{border-color:var(--line);background:var(--panel-2)}
.top-mid{display:flex;gap:8px;align-items:center}
.top-actions{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap}
.btn{font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:14px;padding:6px 11px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--copper);border-color:var(--copper);color:var(--copper-ink)}
.btn.icon{padding:6px 8px}
.btn.danger{color:var(--err)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.small{font-size:13px;padding:4px 9px}
.link{background:none;border:0;padding:0;color:var(--tip);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:13px}
select.sel{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:6px 8px;font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;max-width:260px}
.mobile-only{display:none}

/* Grille principale */
.app{flex:1;display:grid;--libw:240px;--inspw:380px;grid-template-columns:var(--libw) minmax(0,1fr) var(--inspw);grid-template-rows:minmax(0,1fr);min-height:0}
.app>.lib{grid-column:1;grid-row:1}.app>.stage{grid-column:2;grid-row:1}.app>.insp{grid-column:3;grid-row:1}
.lib,.insp{background:var(--panel);overflow:auto;min-height:0}
.lib{border-right:1px solid var(--line);padding:10px 10px 24px}
.insp{border-left:1px solid var(--line);display:flex;flex-direction:column}

/* Bibliothèque */
.lib h3{font-family:'Barlow Semi Condensed',sans-serif;font-size:15px;font-weight:700;margin:14px 4px 6px;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.lib h3:first-of-type{margin-top:4px}
.lib-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 8px;cursor:grab;color:var(--ink)}
.lib-item:hover{background:var(--panel-2);border-color:var(--line)}
.lib-item{touch-action:pan-y}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
.ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ink-3);border-radius:8px;padding:6px 10px;box-shadow:var(--shadow);display:grid;gap:1px;max-width:260px}
.ghost[hidden]{display:none}
.ghost b{font-family:'Barlow Semi Condensed',sans-serif;font-size:14px}
.ghost span{font-size:12px;color:var(--ink-2)}
.ghost.onwire{border-left-color:var(--copper)}
.ghost.onwire span{color:var(--copper);font-weight:600}
.insmenu{position:absolute;z-index:15;width:290px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:grid;gap:4px}
.insmenu .im-h{font:700 14.5px 'Barlow Semi Condensed',sans-serif;padding:4px 6px 2px}
.insmenu button{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;cursor:pointer;align-items:start}
.insmenu button:hover,.insmenu button:focus-visible{border-color:var(--copper)}
.insmenu button b{font-weight:600;font-size:13.5px;line-height:1.25}
.insmenu button small{grid-column:1/-1;color:var(--ink-2);font-size:12px}
.insmenu .tag{margin:0}
.insmenu .im-f{display:flex;gap:4px}
.insmenu .im-f button{flex:1;display:block;text-align:center;background:none;font:600 13px 'Barlow Semi Condensed',sans-serif}
.lib-item span.t{flex:1;min-width:0}
.lib-item small{display:block;font-size:11.5px;color:var(--copper);font-weight:600}
.lib-row{display:flex;align-items:center;gap:2px}
.lib-row .lib-item{flex:1;min-width:0}
.star{flex:none;width:34px;height:34px;border:0;background:none;border-radius:6px;cursor:pointer;font-size:18px;line-height:1;color:var(--ink-3)}
.star:hover{background:var(--panel-2);color:var(--copper)}
.star[aria-pressed="true"]{color:var(--copper)}
.hstar{color:var(--copper);font-size:14px}
.lib-search{position:sticky;top:-10px;z-index:2;background:var(--panel);padding:2px 0 6px;margin:-2px 0 2px}
.lib-search{display:flex;gap:6px;align-items:center}
.lib-search .lib-all{flex:none;width:38px;height:36px;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;display:grid;place-items:center;color:var(--ink-2);cursor:pointer;padding:0}
.lib-search .lib-all:hover{color:var(--copper)}
.lib-search .lib-all svg{width:18px;height:18px}
.lib-search input{width:100%;min-width:0;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:8px 10px;font-size:14px}
.lib h3 .cat-h{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:7px;width:100%;cursor:pointer;padding:2px 0;border-radius:5px}
.lib h3 .cat-h:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.chev{width:12px;color:var(--ink-3);font-size:12px}
.cnt{font-weight:600;color:var(--ink-3);font-size:12px;margin-left:auto;padding-right:6px}
.posbar{position:absolute;left:12px;bottom:12px;max-width:min(640px,calc(100% - var(--zoomw,330px) - 36px));background:rgba(10,20,16,.72);color:#fff;border-radius:10px;padding:8px 10px;backdrop-filter:blur(4px);display:grid;gap:6px;z-index:5}
.posbar[hidden]{display:none}
.pb-head{display:flex;align-items:center;gap:10px;font:600 13.5px 'Barlow Semi Condensed',sans-serif}
.pb-t{margin-left:auto;background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:2px 8px;font:600 12.5px 'Barlow Semi Condensed',sans-serif;cursor:pointer}
.pb-g{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pb-g>span{font-size:12.5px;color:rgba(255,255,255,.8);min-width:110px}
.posbar .seg{margin:0}
.posbar .seg button{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.25);min-width:42px}
.posbar .seg button[aria-pressed="true"]{background:#e0904f;border-color:#e0904f;color:#1d1208}
.zoom button[aria-pressed="true"]{background:rgba(224,144,79,.35)}
@media (max-width:900px){.posbar{max-width:calc(100% - 24px);bottom:64px}}
.stage.pb-up .posbar{max-width:calc(100% - 24px);bottom:64px}
@media (max-width:640px){.zoom .sc{display:none}.zoom button{padding:5px 7px;white-space:nowrap;font-size:14px}}
.lib-empty{font-size:12.5px;color:var(--ink-3);margin:2px 8px 6px}
.lib-manage{margin:10px 4px 0}
.dh{font-family:'Barlow Semi Condensed',sans-serif;font-size:16px;margin:14px 0 6px}
.dh:first-child{margin-top:0}
.plist .rn{width:100%;border:1px solid transparent;background:transparent;border-radius:5px;padding:3px 5px;font-weight:600}
.plist .rn:hover,.plist .rn:focus{border-color:var(--line);background:var(--panel-2)}
.lib-item .stk{font-size:12px;color:var(--ok);font-weight:600;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:3px;flex:none;display:inline-block}
.c-micro{background:#8c3b2e}.c-pot{background:#34587f}.c-switch{background:#5d6b2c}.c-passive{background:#6b4a7a}.c-conn{background:#4c5257}.c-test{background:#8a6a1e}.c-preamp{background:#2f6d68}
.lib-note{font-size:12.5px;color:var(--ink-3);margin:16px 4px 0}

/* Établi */
.stage{position:relative;overflow:hidden;background-color:var(--paper);touch-action:none;user-select:none;-webkit-user-select:none}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage.mat{--paper:var(--mat);--grid-a:var(--mat-a);--grid-b:var(--mat-b);--svg-ink:#eef2ee;--svg-ink2:#b9c6be}
.sc{display:flex;align-items:center;gap:6px;color:#fff;font:600 12.5px 'Barlow Semi Condensed',sans-serif;padding:0 8px 0 4px;white-space:nowrap}
.sc i{display:block;height:7px;border:2px solid #fff;border-top:0;min-width:4px}
.stage-hint{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);color:var(--svg-ink2);text-align:center;max-width:340px;pointer-events:none;font-size:15px}
.stage-hint strong{display:block;font-family:'Barlow Semi Condensed',sans-serif;font-size:20px;margin-bottom:4px;color:var(--svg-ink)}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:4px;background:rgba(10,20,16,.55);padding:4px;border-radius:8px;backdrop-filter:blur(4px)}
.zoom button{background:transparent;border:0;color:#fff;font:600 15px 'Barlow Semi Condensed',sans-serif;padding:5px 10px;border-radius:5px;cursor:pointer}
.zoom button:hover{background:rgba(255,255,255,.14)}
.legend{position:absolute;left:12px;bottom:12px;color:rgba(255,255,255,.8);font-size:12.5px;background:rgba(10,20,16,.5);padding:6px 10px;border-radius:8px;max-width:min(520px,60%);backdrop-filter:blur(4px)}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;background:#f0a565;vertical-align:middle;margin-right:5px;box-shadow:0 0 6px #f0a565}
.stage-tl{position:absolute;left:12px;top:12px;display:flex;gap:8px;align-items:center;z-index:6;max-width:calc(100% - 24px)}
.sbar{display:flex;gap:2px;background:rgba(10,20,16,.6);padding:3px;border-radius:9px;backdrop-filter:blur(4px)}
.sbtn{display:grid;place-items:center;width:32px;height:30px;border:0;border-radius:6px;background:transparent;color:#fff;cursor:pointer}
.sbtn:hover{background:rgba(255,255,255,.16)}
.sbtn[aria-pressed="true"]{background:rgba(224,144,79,.4)}
.sbtn .ico-min{display:none}
body.fs .sbtn .ico-min{display:block}body.fs .sbtn .ico-max{display:none}
body.nolib #libBtn .ico-fill,body.noinsp #inspBtn .ico-fill{opacity:0}
body.nolib .app{--libw:0px}body.nolib .lib{display:none}
body.noinsp .app{--inspw:0px}body.noinsp .insp{display:none}
body.osclock .app{--inspw:min(580px,46vw)}
body.fs .top{display:none!important}
body.nfs-touch .stage-tl{top:84px}
@media (max-width:1100px){.app{--libw:220px;--inspw:310px}body.osclock .app{--inspw:min(500px,50vw)}}
@media (max-width:900px){.app>.stage{grid-column:1}body.nolib .lib,body.noinsp .insp{display:flex}body.nolib .lib{display:block}body.osclock .insp{width:min(96vw,560px)}}
.statuspill{position:static;border:0;border-radius:20px;padding:6px 12px;font:600 13.5px 'Barlow Semi Condensed',sans-serif;cursor:pointer;background:rgba(10,20,16,.6);color:#fff;backdrop-filter:blur(4px);display:flex;gap:10px;align-items:center}
.statuspill b{font-weight:700}
.statuspill .e{color:#ff9a90}.statuspill .w{color:#f6c27a}.statuspill .g{color:#9fe0b6}
.now-float{position:absolute;right:12px;top:12px;max-width:min(380px,55%);background:rgba(10,20,16,.6);color:#fff;border-radius:10px;padding:8px 12px;backdrop-filter:blur(4px);pointer-events:none}
.now-float .k{font-size:12px;color:rgba(255,255,255,.7)}
.now-float .v{font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:16px;color:#ffc999;line-height:1.25}

/* Inspecteur */
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px;gap:2px;flex:none;background:var(--panel);position:sticky;top:0;z-index:2}
.tab{border:0;background:none;padding:10px 10px 9px;font:600 14.5px 'Barlow Semi Condensed',sans-serif;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--copper)}
.tab .n{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;font-size:12px;background:var(--err);color:#fff;margin-left:4px}
.pane{padding:14px 14px 40px;overflow:auto;flex:1}
.pane h2{font-family:'Barlow Semi Condensed',sans-serif;font-size:21px;margin:0;line-height:1.15}
.pane h3{font-family:'Barlow Semi Condensed',sans-serif;font-size:16px;margin:20px 0 8px}
.muted{color:var(--ink-3)}
.pane p{margin:6px 0}
.head{display:flex;gap:9px;align-items:flex-start;margin-bottom:12px}
.head .dot{margin-top:7px}
.fields{display:grid;gap:10px}
.fld{display:grid;gap:3px}
.fld>span{font-size:12.5px;color:var(--ink-2);font-weight:600}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:7px 8px;width:100%}
.fld textarea{min-height:90px;resize:vertical}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.help{font-size:12.5px;color:var(--ink-2);background:var(--panel-2);border-radius:6px;padding:8px 10px;margin-top:10px}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.seg button{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:5px 10px;cursor:pointer;font:600 13.5px 'Barlow Semi Condensed',sans-serif}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.conns{list-style:none;padding:0;margin:0;display:grid;gap:4px;font-size:13px}
.conns li{display:grid;grid-template-columns:12px 1fr;gap:6px;align-items:start;padding:5px 0;border-bottom:1px solid var(--line)}
.conns .sw{margin-top:4px}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.35);vertical-align:-1px;flex:none}
.rowact{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.swatches{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.swatches button[aria-pressed="true"]{border-color:var(--copper);box-shadow:0 0 0 2px var(--copper)}
.swatches .auto{width:auto;border-radius:15px;padding:0 10px;background:var(--panel-2);font:600 12.5px 'Barlow Semi Condensed',sans-serif}
.colorgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.now{border-left:3px solid var(--copper);background:var(--copper-soft);border-radius:0 8px 8px 0;padding:10px 12px}
.now .v{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:19px;line-height:1.2;margin:2px 0 8px}
.now dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:13.5px}
.now dt{color:var(--ink-2)}.now dd{margin:0;font-weight:600}
.iss{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.iss li{border:1px solid var(--line);border-left-width:4px;border-radius:6px;padding:8px 10px;background:var(--panel)}
.iss li.lv-error{border-left-color:var(--err)}.iss li.lv-warn{border-left-color:var(--warn)}.iss li.lv-tip{border-left-color:var(--tip)}.iss li.lv-info{border-left-color:var(--ink-3)}
.iss .lv{font-size:12px;font-weight:700;font-family:'Barlow Semi Condensed',sans-serif}
.lv-error .lv{color:var(--err)}.lv-warn .lv{color:var(--warn)}.lv-tip .lv{color:var(--tip)}.lv-info .lv{color:var(--ink-3)}
.iss strong{display:block;font-size:14px;line-height:1.3}
.iss p{font-size:13px;color:var(--ink-2);margin:3px 0 0}
.iss .acts{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.okbox{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:6px;padding:8px 10px;font-weight:600}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{text-align:left;font:600 12.5px 'Barlow Semi Condensed',sans-serif;color:var(--ink-2);padding:6px 8px;background:var(--panel-2);border-bottom:1px solid var(--line);vertical-align:bottom;line-height:1.2}
table.t td{padding:6px 7px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover{background:var(--panel-2)}
table.t tr.on{background:var(--copper-soft)}
table.t tr.on td:first-child{box-shadow:inset 3px 0 0 var(--copper)}
.tag{display:inline-block;font:600 11.5px 'Barlow Semi Condensed',sans-serif;padding:1px 6px;border-radius:9px;border:1px solid currentColor;margin-left:4px;white-space:nowrap}
.tag.warn{color:var(--warn)}.tag.err{color:var(--err)}.tag.ok{color:var(--ok)}
.qty{width:58px;border:1px solid var(--line);background:var(--panel-2);border-radius:5px;padding:3px 5px}
.miss{color:var(--err);font-weight:700}.okq{color:var(--ok);font-weight:700}
.addstock{display:grid;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px}

/* Fenêtres */
dialog{border:0;border-radius:12px;padding:0;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);width:min(760px,94vw);max-height:88vh}
dialog::backdrop{background:rgba(10,15,12,.5)}
.dlg{display:flex;flex-direction:column;max-height:88vh}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg-h h2{margin:0;font-family:'Barlow Semi Condensed',sans-serif;font-size:21px}
.dlg-b{padding:14px 16px;overflow:auto}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg-f .dlg-left{margin-right:auto}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.plist li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.plist li.cur{border-color:var(--copper)}
.plist .nm{flex:1;min-width:0}
.plist .nm b{display:block}
.plist .nm small{color:var(--ink-3)}
.fichebox{background:#fff;color:#1c231f;border-radius:8px;padding:16px;border:1px solid var(--line)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.theme{display:grid;gap:3px;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:10px;cursor:pointer}
.theme[aria-pressed="true"]{border-color:var(--copper);box-shadow:0 0 0 2px var(--copper-soft)}
.theme small{color:var(--ink-2);font-size:12.5px}
.tpv{display:flex;height:64px;border-radius:7px;overflow:hidden;border:1px solid rgba(0,0,0,.18);margin-bottom:6px;padding:6px;gap:6px}
.tpv-side{width:34%;border-radius:4px;display:grid;align-content:start;gap:5px;padding:6px}
.tpv-side i{display:block;height:5px;border-radius:3px}
.tpv-main{flex:1;border-radius:4px;position:relative;display:flex;align-items:flex-end;justify-content:flex-end;padding:4px 7px}
.tpv-main b{font:700 17px 'Barlow Semi Condensed',sans-serif}
.tpv-w{position:absolute;left:10px;top:12px;width:46%;height:18px;border:3px solid;border-color:inherit;border-top:0;border-right:0;border-radius:0 0 0 14px}
dialog.wide{width:min(1060px,96vw)}
.aw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px}
.aw-f{margin:0 0 8px}
.aw-list{display:grid;gap:5px;max-height:58vh;overflow:auto;padding-right:4px}
.aw-item{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:8px 10px;cursor:pointer}
.aw-item[aria-pressed="true"]{border-color:var(--copper);background:var(--copper-soft)}
.aw-item small{color:var(--ink-2);font-size:12.5px}
.aw-r{max-height:62vh;overflow:auto}
.aw-bench{font-size:14px;margin:0 0 8px}.aw-bench b{font-size:16px;color:var(--copper)}.aw-bench small{color:var(--ink-2);margin-left:4px}
.aw-codes{display:grid;gap:6px;margin:0 0 6px}.aw-cg{display:flex;align-items:flex-start;gap:8px}.aw-cg .seg{flex:1;min-width:0}.awc-n{padding-top:7px}.awc-n{font-size:12px;color:var(--ink-3);width:58px;flex:none}
.aw-codes .seg{flex-wrap:wrap}.aw-codes .seg button{position:relative;font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;letter-spacing:.04em;min-width:44px}
.awc-me{position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--copper)}
.aw-hint{font-size:12px;margin:0 0 10px}
.awq{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;background:var(--panel-2)}

class UF{

  add(x){if(!this.p.has(x))this.p.set(x,x);}
  find(x){if(!this.p.has(x))this.p.set(x,x);let r=x;while(this.p.get(r)!==r)r=this.p.get(r);let y=x;while(this.p.get(y)!==r){const n=this.p.get(y);this.p.set(y,r);y=n;}return r;}

const flipE=e=>({...e,u:e.v,v:e.u,sig:-e.sig,hum:-e.hum,coils:e.coils.map(k=>({...k,s:-k.s}))});
const opp=(a,b)=>Math.abs(a)>0.05&&Math.abs(b)>0.05&&Math.sign(a)!==Math.sign(b);
const serE=(a,b)=>({u:a.u,v:b.v,sig:a.sig+b.sig,hum:a.hum+b.hum,z:a.z+b.z,op:'S',parts:[a,b],coils:a.coils.concat(b.coils),flag:a.flag||b.flag||opp(a.sig,b.sig)});

function reduceSP(edges,tip,gnd){
  let E=edges.slice();const isT=n=>n===tip||n===gnd;
  for(let guard=0;guard<2000;guard++){
    const n0=E.length;E=E.filter(e=>e.u!==e.v);
    const deg={};E.forEach(e=>{deg[e.u]=(deg[e.u]||0)+1;deg[e.v]=(deg[e.v]||0)+1;});
    const E2=E.filter(e=>!((deg[e.u]===1&&!isT(e.u))||(deg[e.v]===1&&!isT(e.v))));
    if(E2.length!==E.length){E=E2;continue;}
    let merged=false;const seen=new Map();
    for(let i=0;i<E.length;i++){const e=E[i];const k=e.u<e.v?e.u+'|'+e.v:e.v+'|'+e.u;
      if(seen.has(k)){const j=seen.get(k);let b=e;if(b.u!==E[j].u)b=flipE(b);E[j]=parE(E[j],b);E.splice(i,1);merged=true;break;}
      seen.set(k,i);}
    if(merged)continue;
    for(const n of Object.keys(deg)){
      if(deg[n]!==2||isT(n))continue;
      const inc=[];E.forEach((e,i)=>{if(e.u===n||e.v===n)inc.push(i);});
      if(inc.length!==2)continue;
      let a=E[inc[0]],b=E[inc[1]];if(a.u===n)a=flipE(a);if(b.v===n)b=flipE(b);
      const m=serE(a,b);E=E.filter((_,i)=>i!==inc[0]&&i!==inc[1]);E.push(m);merged=true;break;
    }

}
function isAtom(x,byId){

function labelE(e,byId,parentOp){

  if(cids.length===1){
    const c=byId[cids[0]],T=TYPES[c.type],all=T.coils(c),nm=displayName(c);
    if(e.op==='L'){
      if(all.length===1)return nm;
      const co=all[e.coils[0].i],ts=T.terms(c);
      return `${nm} (bobine ${ts.find(t=>t.id===co.a).label.toLowerCase()}/${ts.find(t=>t.id===co.b).label.toLowerCase()} seule)`;
    }
    if(e.coils.length===all.length)return `${nm} (${e.flag?'bobines hors phase':e.op==='S'?'2 bobines en série':'2 bobines en parallèle'})`;
  }
  const flat=[];const walk=x=>{if(x.op===e.op&&x.parts&&!isAtom(x,byId))x.parts.forEach(walk);else flat.push(x);};
  e.parts.forEach(walk);
  const s=flat.map(p=>labelE(p,byId,e.op)).join(e.op==='S'?' + ':' ∥ ')+(e.op==='S'&&flat.length>1?' en série':'');
  return parentOp&&parentOp!==e.op&&flat.length>1?`(${s})`:s;
}

function analyzeState(P,combo){

      if((sig.has(x)&&y===gnd)||(sig.has(y)&&x===gnd)){out.capShort.push(c.id);return;}
      [[x,y],[y,x]].forEach(([p,q])=>potRes.forEach(r=>{
        if(q===gnd&&((r.x===p&&sig.has(r.y))||(r.y===p&&sig.has(r.x))))tones.add(r.c);
        if(sig.has(q)&&((r.x===p&&r.y===gnd)||(r.y===p&&r.x===gnd)))tones.add(r.c);
      }));
    }));
    out.tones=[...tones];
  }
  return out;
}

function enumerate(P){
  const ctrls=[];P.comps.forEach(c=>ctrlsOf(c).forEach(ct=>{if(ct.enumerate)ctrls.push({c,ct});}));
  let combos=[{}],truncated=false;
  for(const {c,ct} of ctrls){
    const nx=[];for(const cb of combos)for(let i=0;i<ct.opts.length;i++)nx.push({...cb,[c.id+'|'+ct.key]:i});
    combos=nx;if(combos.length>256){combos=combos.slice(0,256);truncated=true;}
  }
  return {ctrls,combos,truncated};
}
function ctrlText(ct,i){return ct.chip?ct.chip(i):ct.opts[i];}
function comboLabel(ctrls,cb){
  if(!ctrls.length)return 'Câblage fixe';
  return ctrls.map(({c,ct})=>`${displayName(c)} ${ctrlText(ct,cb[c.id+'|'+ct.key])}`).join(', ');
}

function bomKey(c){
  const p=c.props;
  switch(c.type){
    case 'single':return `pu|single|${p.kind}|${p.brand}|${(p.model||'').trim()}|${puStr(c)}`;
    case 'hb4':return `pu|hb4|${p.kind}|${p.brand}|${(p.model||'').trim()}|${puStr(c)}`;
    case 'hb2':case 'pbass':case 'active':return `pu|${c.type}|${(p.model||'').trim()}|${puStr(c)}|${p.kind||''}|${p.brand||p.maker||''}`;
    case 'pot':return `pot|${p.value}|${p.taper}`;
    case 'pushpull':return `pp|${p.value}|${p.taper}|${p.mech}`;
    case 'potmid':return `pmid|${p.value}|${p.taper}`;
    case 'balance':return `bal|${p.value}|${p.taper}`;
    case 'cap':return `cap|${p.value}|${capStyleOf(c)}`;
    case 'res':return `res|${p.value}|${p.bands||'4'}`;
    case 'kill':return `kill|${p.contact}`;
    case 'bus':case 'joint':case 'bridgegnd':case 'gndsym':case 'amp':return null;
    case 'shield':return 'shield';
    default:return c.type;
  }
}
function bomLabel(c){
  const p=c.props,T=TYPES[c.type];
  switch(c.type){
    case 'shield':return 'Ruban adhésif cuivre pour blindage (une zone par ligne de quantité)';
    case 'single':return `Micro ${opt(SC_KINDS,p.kind)}${p.model?' '+p.model:''}${puStrTxt(c)?', '+puStrTxt(c):''} (${brandName(p.brand,SC_BRANDS)})`;
    case 'hb4':return `Humbucker${p.kind==='bass'?' basse':''}${p.model?' '+p.model:''}${puStrTxt(c)?', '+puStrTxt(c):''} (${brandName(p.brand,HB_BRANDS)})`;
    case 'hb2':return `Humbucker 2 conducteurs${p.model?' '+p.model:''}${puStrTxt(c)?', '+puStrTxt(c):''}`;
    case 'pbass':return `Micro P-Bass${p.model?' '+p.model:''}${puStrTxt(c)?', '+puStrTxt(c):''}`;
    case 'active':return `Micro actif${p.kind==='bass'?' basse':''}${p.model?' '+p.model:''}${puStrTxt(c)?', '+puStrTxt(c):''}`;
    case 'pot':return `Potentiomètre ${opt(POT_VALUES,p.value)} ${p.taper==='A'?'log (A)':'linéaire (B)'}`;
    case 'pushpull':return `Potentiomètre ${p.mech==='push'?'push-push':'push-pull'} ${opt(POT_VALUES,p.value)} ${p.taper==='A'?'log (A)':'linéaire (B)'}`;
    case 'potmid':return `Potentiomètre à point milieu ${opt(POTMID_VALUES,p.value)} ${p.taper==='A'?'log (A)':'linéaire (B)'}`;
    case 'balance':return `Potentiomètre balance double 2 × ${opt(BAL_VALUES,p.value)} ${p.taper==='B'?'linéaire':'M/N'}`;
    case 'cap':{const st=capStyleOf(c);return `Condensateur ${opt(CAP_STYLES,st)} ${capLabel(p.value)}, marquage ${capMarks(c).join(' ')}`;}
    case 'res':{const rc=resCode(p.value,p.bands);return `Résistance ${resLabel(p.value)}${rc?` ± ${rc.tol} (${rc.bands.map(b=>BAND_NAME[b].toLowerCase()).join(', ')})`:''}`;}
    case 'jack':return 'Jack mono 6,35 mm';
    case 'jack_st':return 'Jack stéréo 6,35 mm';
    case 'battery':return 'Pile 9 V et clip';
    case 'kill':return `Kill switch ${T.spec(c)}`;
    default:return T.name;
  }
}
function bom(P){
  const m=new Map();
  P.comps.forEach(c=>{const k=bomKey(c);if(!k)return;const e=m.get(k)||{key:k,label:bomLabel(c),cat:TYPES[c.type].cat,qty:0};e.qty++;m.set(k,e);});
  const order=['micro','pot','switch','passive','conn'];
  return [...m.values()].sort((a,b)=>order.indexOf(a.cat)-order.indexOf(b.cat)||a.label.localeCompare(b.label,'fr'));
}

function staticIssues(P,rows,cur){
  const out=[],add=(level,title,detail,o={})=>out.push({level,title,detail,...o});
  const byId=idx(P),comps=P.comps,dn=displayName;
  const wired=new Set();P.wires.forEach(w=>{wired.add(w.a.c+'.'+w.a.t);wired.add(w.b.c+'.'+w.b.t);});
  const pickups=comps.filter(c=>TYPES[c.type].cat==='micro');
  const actives=pickups.filter(c=>c.type==='active'),passives=pickups.filter(c=>c.type!=='active');
  const pots=comps.filter(c=>TYPES[c.type].cat==='pot');
  const jacks=comps.filter(c=>c.type==='jack'||c.type==='jack_st');
  const bass=P.meta.instrument==='basse';
  const shs=comps.filter(c=>c.type==='shield');
  if(shs.length){
    const allC=new Set();shs.forEach(sh=>shieldMembers(P,sh).forEach(c=>allC.add(c.id)));
    add('info','Blindage : attention aux boucles de masse',`Avec un cuivre à colle conductrice, les pièces vissées dessus prennent leur masse par le cuivre${allC.size?' (ici : '+[...allC].map(id=>dn(byId[id])).join(', ')+')':''}. Un fil de masse en plus entre leurs boîtiers ouvre un second chemin et crée une boucle, source de buzz. Gardez une masse en étoile : un seul chemin par élément. Les condensateurs sont soudés en l’air et les cavités des micros ne sont pas concernées.`);
    shs.forEach(sh=>{
      if(!cur||!cur.gnd||cur.net(sh.id,'gnd')!==cur.gnd)add('warn',`${dn(sh)} : non relié à la masse`,'Aucune pièce au contact du cuivre n’est à la masse et sa cosse n’est reliée à rien. Le blindage doit rejoindre la masse générale par un seul chemin.',{focus:sh.id});
      if(!shieldMembers(P,sh).length)add('info',`${dn(sh)} : aucune pièce au contact`,'Agrandissez le rectangle pour couvrir les potentiomètres et sélecteurs vissés dans la cavité.',{focus:sh.id});
      shieldJacks(P,sh).forEach(j=>add('warn',`${dn(j)} au contact du blindage`,'Le jack ne doit pas toucher le cuivre : sa masse arrive déjà par son fil vers le volume, le cuivre ferait un second chemin (boucle de masse). Isolez-le (rondelle isolante, cuivre détouré) ou décochez-le dans la liste du blindage.',{focus:j.id}));
      P.wires.forEach(w=>{const e=[w.a,w.b];const j=e.find(x=>{const c=byId[x.c];return c&&(c.type==='jack'||c.type==='jack_st')&&x.t==='sleeve';}),o=e.find(x=>x.c===sh.id);
        if(j&&o)add('warn',`${dn(byId[j.c])} relié directement au blindage`,'Reliez la masse du jack au boîtier du potentiomètre de volume (point de masse en étoile), pas au cuivre.',{focus:j.c});});
    });
    if(cur&&cur.gnd){
      /* Boucles : chemins de masse en double, comptés sur le graphe des fils de masse et des liaisons par le cuivre */
      const B=new Set();shieldBonds(P).forEach(([s,c,t])=>{B.add(s+'.gnd');B.add(c+'.'+t);});
      const gw=P.wires.filter(w=>w.a.c&&w.b.c&&byId[w.a.c]&&byId[w.b.c]&&cur.net(w.a.c,w.a.t)===cur.gnd&&cur.net(w.b.c,w.b.t)===cur.gnd);
      const edges=shieldBonds(P).map(([s,c,t])=>[s+'.gnd',c+'.'+t,null]).concat(gw.map(w=>[w.a.c+'.'+w.a.t,w.b.c+'.'+w.b.t,w]));
      const conn=(skip,a,b)=>{const u=new UF();edges.forEach((e,i)=>{if(i!==skip)u.union(e[0],e[1]);});return u.find(a)===u.find(b);};
      const loopW=[];edges.forEach((e,i)=>{if(e[2]&&e[0]!==e[1]&&conn(i,e[0],e[1]))loopW.push(e[2]);});
      if(loopW.length){const both=loopW.filter(w=>B.has(w.a.c+'.'+w.a.t)&&B.has(w.b.c+'.'+w.b.t));
        const txt=w=>`${endText(w.a)} ↔ ${endText(w.b)}`;
        add('warn',`Boucle de masse : ${loopW.length} fil${loopW.length>1?'s':''} en double`,(both.length?`À retirer en priorité, les deux bouts touchent déjà le cuivre : ${both.map(txt).join(' ; ')}. `:'')+`Fils qui referment une boucle : ${loopW.slice(0,6).map(txt).join(' ; ')}${loopW.length>6?'…':''}. Le câblage auto retire ces fils quand un blindage est présent.`,{focus:(both[0]||loopW[0]).a.c});}
    }
  }
  const strSet=new Set(pickups.map(c=>puStr(c)));
  if(strSet.size>1)add('warn','Micros de nombres de cordes différents',pickups.map(c=>`${dn(c)} : ${puStr(c)} cordes`).join(', ')+'. Vérifiez que tous les micros correspondent à l’instrument.');
  if(!jacks.length)add('error','Aucun jack de sortie','Ajoutez un jack depuis la bibliothèque, section Connectique.');
  if(jacks.length>1)add('warn','Plusieurs jacks','Seul le premier jack posé est analysé comme sortie.');
  if(!pickups.length)add('info','Aucun micro','Ajoutez au moins un micro pour lancer l’analyse.');
  jacks.slice(0,1).forEach(j=>['tip','sleeve'].forEach(t=>{if(!wired.has(j.id+'.'+t))add('error',`${dn(j)} : ${t==='tip'?'pointe (signal)':'masse'} non câblée`,t==='tip'?'Reliez la pointe à la sortie du volume ou du sélecteur.':'Reliez le corps du jack à la masse générale.',{focus:j.id});}));
  pickups.forEach(c=>termsOf(c).forEach(t=>{
    if(wired.has(c.id+'.'+t.id))return;
    if(c.type==='hb4'&&(t.id==='l2'||t.id==='l3'))add('warn',`${dn(c)} : fil ${t.label.toLowerCase()} libre`,'En câblage série, soudez les deux fils « série » ensemble et isolez la soudure. Ils servent aussi pour un split.',{focus:c.id});
    else if(t.id==='bare'||t.id==='shield')add('warn',`${dn(c)} : tresse non reliée à la masse`,'Sans masse, le blindage du micro capte du bruit.',{focus:c.id});
    else add('warn',`${dn(c)} : ${t.long} non connecté`,'Chaque fil du micro doit aller quelque part, ou être isolé volontairement.',{focus:c.id});
  }));
  const unchecked=pickups.filter(c=>!c.props.checked);
  if(unchecked.length)add('tip',`Codes couleur à confirmer : ${unchecked.length} micro${unchecked.length>1?'s':''}`,'Comparez chaque fil avec la notice du fabricant, puis cochez « Couleurs vérifiées » dans l’onglet Pièce. Enregistrez ensuite le micro comme pièce perso : il sera prêt, vérifié, pour vos prochains câblages.',{focus:unchecked[0].id});
  const heard=new Set();rows.forEach(r=>r.r.activeCoils.forEach(k=>heard.add(k.split(':')[0])));
  pickups.forEach(c=>{if(!heard.has(c.id))add('error',`${dn(c)} n’est entendu dans aucune position`,'Suivez son fil chaud jusqu’au sélecteur ou au volume. S’il est actif, vérifiez son alimentation.',{focus:c.id});});
  const unp=new Set();rows.forEach(r=>r.r.unpowered.forEach(id=>unp.add(id)));
  unp.forEach(id=>add('error',`${dn(byId[id])} n’est pas alimenté`,'Reliez son +9 V au + de la pile, le − de la pile à la bague d’un jack stéréo, et sa masse à la masse générale.',{focus:id}));
  const pres=comps.filter(c=>c.type==='preamp');
  if(actives.length||pres.length){
    const bats=comps.filter(c=>c.type==='battery'),jst=comps.find(c=>c.type==='jack_st');
    if(jacks.length&&!jst){const j=jacks[0];add('error','Jack stéréo nécessaire',`Avec ${pres.length?'un préampli':'des micros actifs'}, la bague du jack stéréo allume la pile quand le câble est branché.`,{focus:j.id,action:{label:'Passer en jack stéréo',fn:P=>{j.type='jack_st';}}});}
    if(!bats.length)add('error','Pile 9 V manquante',`${pres.length?'Le préampli a':'Les micros actifs ont'} besoin d’une pile 9 V.`,{action:{label:'Ajouter et câbler une pile',fn:P=>{
      const j=P.comps.find(c=>c.type==='jack_st'||c.type==='jack');const b=makeComp('battery',{},(j?j.x:600),(j?j.y-170:100));P.comps.push(b);
      P.comps.filter(c=>c.type==='active'||c.type==='preamp').forEach(a=>P.wires.push({id:uid('w'),a:{c:b.id,t:'pos'},b:{c:a.id,t:'v9'},color:'rouge'}));
      if(j){if(j.type==='jack')j.type='jack_st';P.wires.push({id:uid('w'),a:{c:b.id,t:'neg'},b:{c:j.id,t:'ring'},color:'noir'});}
    }}});
  }
  pres.forEach(c=>{const m=preM(c);
    if(m.dual)add('info',`${dn(c)} : deux sorties`,'Chaque micro a son propre tampon : reliez les deux sorties à votre balance ou à vos volumes passifs, puis au jack.',{focus:c.id});
    if(m.midint)add('tip',`${dn(c)} : fréquence des médiums sur la carte`,'Le choix se fait par cavalier ou micro-interrupteur sur le circuit : réglez-le dans l’onglet Pièce pour que la simulation corresponde.',{focus:c.id});
    if(!m.vol&&!m.pp)add('tip',`${dn(c)} : pas de volume intégré`,'Prévoyez un potentiomètre de volume (et une balance pour deux micros) avant l’entrée du préampli. Le câblage auto le fait.',{focus:c.id});});
  if(pres.length&&pickups.some(c=>c.type==='active'))add('warn','Micros actifs et préampli','Des micros actifs ont souvent déjà leur propre préampli : vérifiez la notice avant d’en ajouter un.');
  if(actives.length&&passives.length)add('warn','Micros actifs et passifs mélangés','Les pots ne conviennent pas aux deux : 25 kΩ pour les actifs, 250 à 500 kΩ pour les passifs. Prévoyez un tampon actif ou des volumes séparés.');
  const setPots=(list,v)=>({label:`Passer en ${opt(POT_VALUES,v)}`,fn:()=>list.forEach(p=>p.props.value=v)});
  if(actives.length&&!passives.length){
    const wrong=pots.filter(p=>p.props.value!=='25k');
    if(wrong.length)add('tip','Pots de 25 kΩ recommandés pour les micros actifs',`${wrong.length} potentiomètre(s) à une autre valeur. Une valeur plus haute rend le son plus brillant et le réglage moins progressif.`,{action:setPots(wrong,'25k')});
  }else if(passives.length){
    const hasHB=passives.some(c=>c.type==='hb4'||c.type==='hb2');
    const allSingle=passives.every(c=>c.type==='single'||c.type==='pbass');
    const low=pots.filter(p=>p.props.value==='250k'||p.props.value==='25k');
    const high=pots.filter(p=>p.props.value==='500k'||p.props.value==='1M');
    if(hasHB&&!bass&&low.length&&!allSingle&&passives.every(c=>c.type!=='single'))add('tip','500 kΩ conseillés avec des humbuckers','Avec 250 kΩ, un humbucker sonne plus sombre. Gardez 250 kΩ si c’est le son recherché.',{action:setPots(low,'500k')});
    if(hasHB&&passives.some(c=>c.type==='single')&&!bass)add('info','Humbuckers et simples sur le même circuit','Compromis courant : 500 kΩ pour garder du mordant aux humbuckers, ou 250 kΩ pour adoucir les simples. Un push-pull peut aussi commuter la charge.');
    if(allSingle&&!bass&&high.length)add('tip','250 kΩ est la valeur classique pour des simples','500 kΩ donne plus d’aigus, parfois agressifs sur un simple bobinage. À choisir selon le son voulu.',{action:setPots(high,'250k')});
    const p25=pots.filter(p=>p.props.value==='25k');
    if(p25.length)add('warn','Potentiomètre de 25 kΩ avec des micros passifs','Un 25 kΩ charge très fortement un micro passif et étouffe le son.',{focus:p25[0].id,action:setPots(p25,bass?'250k':'500k')});
  }
  pots.filter(p=>p.props.role==='tone'&&TAPER_POTS.has(p.type)&&p.props.taper==='A').forEach(p=>add('tip',`${dn(p)} : courbe linéaire (B) conseillée`,'La règle d’atelier met les tonalités en linéaire (B) : l’effet se répartit sur toute la course du bouton.',{focus:p.id,action:{label:'Passer en B (lin)',fn:()=>{p.props.taper='B';}}}));
  pots.filter(p=>p.props.role==='volume'&&p.props.taper==='B').forEach(p=>add('tip',`${dn(p)} : courbe log (A) conseillée`,'Avec une courbe linéaire, presque tout le volume se joue sur le dernier quart de la course.',{focus:p.id,action:{label:'Passer en A (log)',fn:()=>{p.props.taper='A';}}}));
  if(cur.gnd)pots.forEach(p=>{if(cur.net(p.id,'case')!==cur.gnd)add('warn',`${dn(p)} : boîtier non relié à la masse`,'Soudez le boîtier à la masse pour éviter les ronflements, même si le pot n’en a pas besoin électriquement.',{focus:p.id});});
  if(passives.length){
    const bg=comps.filter(c=>c.type==='bridgegnd');
    if(!bg.length){
      add('tip','Pensez au fil de masse du chevalet','Il relie les cordes à la masse et réduit le bruit au toucher.',{action:{label:'Ajouter la masse chevalet',fn:P=>{
        const v=P.comps.find(c=>c.type==='pot')||P.comps.find(c=>c.type==='jack'||c.type==='jack_st');const g=makeComp('bridgegnd',{},v?v.x:400,v?v.y-130:300);P.comps.push(g);
        if(v)P.wires.push({id:uid('w'),a:{c:g.id,t:'w'},b:{c:v.id,t:v.type==='pot'?'case':'sleeve'},color:null});
      }}});
    }else if(cur.gnd)bg.forEach(g=>{if(cur.net(g.id,'w')!==cur.gnd)add('warn','Masse chevalet non reliée','Reliez le fil du chevalet à la masse générale.',{focus:g.id});});
  }
  const caps=comps.filter(c=>c.type==='cap');
  const nearTone=cp=>P.wires.some(w=>{const o=w.a.c===cp.id?w.b.c:w.b.c===cp.id?w.a.c:null;return o&&byId[o]&&TYPES[byId[o].type].cat==='pot'&&byId[o].props.role==='tone';});
  caps.filter(nearTone).forEach(cp=>{
    const nf=capNF(cp.props.value);
    const hb=passives.some(c=>c.type==='hb4'||c.type==='hb2');
    if(nf<10)add('tip',`${dn(cp)} : valeur très faible pour une tonalité`,'En dessous de 10 nF, la tonalité agit à peine. 1 nF sert plutôt au treble bleed.',{focus:cp.id});
    else if(bass&&nf<33)add('tip',`${dn(cp)} : 47 nF est plus courant sur une basse`,'Une valeur plus forte coupe plus bas et rend la tonalité plus utile sur une basse.',{focus:cp.id,action:{label:'Passer en 47 nF',fn:()=>{cp.props.value='47n';}}});
    else if(!bass&&hb&&nf>33&&actives.length===0)add('info',`${dn(cp)} : ${capLabel(cp.props.value)} avec un humbucker`,'Valeur valable, mais 22 nF est la référence avec des humbuckers : la tonalité reste utilisable plus longtemps.',{focus:cp.id});
  });
  if(passives.length){
    const vols=pots.filter(p=>p.props.role==='volume');
    const hasBleed=v=>caps.some(cp=>{const ends=P.wires.filter(w=>w.a.c===cp.id||w.b.c===cp.id).map(w=>w.a.c===cp.id?w.b:w.a);return ends.some(e=>e.c===v.id&&e.t==='p2')&&ends.some(e=>e.c===v.id&&e.t==='p3');});
    const v=vols.find(x=>!hasBleed(x));
    if(v&&!bass)add('info','Option : treble bleed',`Un condensateur de 1 nF et une résistance de 150 kΩ entre les cosses 2 et 3 de « ${dn(v)} » gardent les aigus quand on baisse le volume.`,{focus:v.id,action:{label:'Ajouter sur ce volume',fn:P=>{
      const cp=makeComp('cap',{value:'1n',name:'Treble bleed'},v.x+130,v.y+20),rs=makeComp('res',{value:'150k',name:'Treble bleed'},v.x+130,v.y+100);P.comps.push(cp,rs);
      [[cp,'t1','p2'],[cp,'t2','p3'],[rs,'t1','p2'],[rs,'t2','p3']].forEach(([c,t,pt])=>P.wires.push({id:uid('w'),a:{c:c.id,t},b:{c:v.id,t:pt},color:null}));
    }}});
  }
  const short=rows.filter(r=>r.r.status==='short');
  if(short.length)add('error',`Court-circuit en ${short.length} position(s)`,'La sortie est reliée directement à la masse : aucun son. Vérifiez les cosses du sélecteur et du volume.');
  /* Switch de phase posé exprès : ses positions hors phase (et le centre d’un on-off-on, micro coupé) sont voulues */
  const phSw=P.comps.filter(c=>c.props.use==='phase'),swAt=(r,c)=>r.combo?r.combo[c.id+'|sw']:undefined;
  const none=rows.filter(r=>r.r.status==='nosignal'&&!P.comps.some(c=>(c.props.use==='phase'||c.props.use==='series')&&c.type==='mini3'&&swAt(r,c)===1));
  if(none.length&&pickups.length)add('warn',`Aucun son en ${none.length} position(s)`,(none.some(r=>r.r.resPath)?'Le signal ne passe que par la piste d’un potentiomètre : vérifiez l’ordre des cosses 1, 2 et 3. ':'Aucun micro n’arrive jusqu’au jack, ou un circuit de micro est ouvert. ')+'Positions concernées : '+none.slice(0,6).map(r=>r.label).join(' ; ')+(none.length>6?'…':'')+'. Normal seulement pour une position « off » voulue.');
  const oop=rows.filter(r=>r.r.phase);
  if(oop.length&&phSw.length&&oop.every(r=>phSw.some(c=>swAt(r,c)===(c.type==='mini3'?2:1))))add('info',`${oop.length} position(s) hors phase, voulues`,`Obtenues par ${phSw.map(c=>'« '+dn(c)+' »').join(', ')} : son creux et nasal, façon « Peter Green ». Basculez le switch pour revenir en phase.`);
  else if(oop.length)add('warn',`${oop.length} position(s) hors phase`,'Son creux et nasal. Parfois voulu (le son « Peter Green »), sinon inversez chaud et froid d’un des micros, ou vérifiez au testeur de polarité que bobinage et aimant sont inversés ensemble (RWRP).');
  const noisy=rows.filter(r=>r.r.status==='ok'&&!r.r.phase&&r.r.hum==='Présent'&&r.r.activeCoils.size>=2&&[...r.r.activeCoils].every(k=>{const c=byId[k.split(':')[0]];return c&&c.type==='single'&&!c.props.noiseless;}));
  if(noisy.length)add('info',`Ronflement non annulé en ${noisy.length} position(s) combinée(s)`,'Les deux simples sont en phase mais bobinés dans le même sens : le bruit s’additionne. Pour l’annuler, l’un des deux doit avoir le bobinage ET l’aimant inversés (RWRP). Positions : '+noisy.slice(0,4).map(r=>r.label).join(' ; ')+(noisy.length>4?'…':'')+'.');
  if(rows.some(r=>r.r.capShort.length)&&!pots.some(p=>(p.state.lvl??10)<=0)){const cid=rows.find(r=>r.r.capShort.length).r.capShort[0];add('warn','Aigus coupés en permanence','Un condensateur relie directement le signal à la masse, même tonalité à 10. Il doit passer par les cosses 1 et 2 du potentiomètre de tonalité, pas par 2 et 3.',{focus:cid});}
  const cx=rows.filter(r=>r.r.status==='complex');
  if(cx.length)add('info','Câblage avancé','Certaines positions forment un réseau qui n’est ni série ni parallèle. L’analyse y est partielle : contrôlez à l’oreille ou au multimètre.');
  const loose=P.wires.filter(w=>!w.a.c||!w.b.c);
  if(loose.length)add('warn',`${loose.length} fil${loose.length>1?'s':''} débranché${loose.length>1?'s':''}`,'Un fil a au moins une extrémité libre. Rebranchez-la sur une cosse en tirant sa poignée, ou supprimez le fil.');
  const order={error:0,warn:1,tip:2,info:3};
  return out.sort((a,b)=>order[a.level]-order[b.level]);
}
function analyze(P){
  const en=enumerate(P);
  const rows=en.combos.map(cb=>({combo:cb,label:comboLabel(en.ctrls,cb),r:analyzeState(P,cb)}));
  const current=analyzeState(P,null);
  return {rows,ctrls:en.ctrls,truncated:en.truncated,current,issues:staticIssues(P,rows,current)};
}

const RECIPE_CFG=[['Un','Un seul micro'],['SSS','Trois simples'],['HSS','HSS'],['HSH','HSH'],['SS','Deux simples (Tele)'],['HH','Deux humbuckers'],['Basse','Basse']];
function recipeById(id){return RECIPES.find(r=>r.id===id)||GENR[id];}
const FAMILY=t=>t==='jack_st'?'jack':t;
function matchRecipe(P,R){
  const used=new Set(),map={},roles=Object.keys(R.parts);
  const preSig=c=>JSON.stringify(preChannels(c).map(ch=>ch.ins));
  const ok=(c,sp)=>FAMILY(c.type)===FAMILY(sp.type)&&!(c.type==='jack'&&sp.type==='jack_st')&&(c.type!=='preamp'||preSig(c)===preSig({props:sp.props}));
  const exact=(c,sp)=>{const T=TYPES[sp.type];if(sp.type==='preamp')return c.props.model===sp.props.model;if(T.cat==='micro')return !sp.props.position||c.props.position===sp.props.position;if(T.cat==='pot')return !sp.props.role||c.props.role===sp.props.role;return c.type===sp.type;};
  for(const pass of [0,1])for(const r of roles){
    if(map[r])continue;const sp=R.parts[r];
    const c=P.comps.find(c=>!used.has(c.id)&&ok(c,sp)&&(pass||exact(c,sp)));
    if(c){map[r]=c.id;used.add(c.id);}
  }
  /* Un push-pull peut tenir la place d’un potentiomètre simple (son switch reçoit ensuite un rôle) ; l’inverse est impossible */
  for(const pass of [0,1])for(const r of roles){
    if(map[r]||R.parts[r].type!=='pot')continue;const sp=R.parts[r];
    const c=P.comps.find(c=>!used.has(c.id)&&c.type==='pushpull'&&(pass||!sp.props.role||c.props.role===sp.props.role));
    if(c){map[r]=c.id;used.add(c.id);}
  }
  return {map,missing:roles.filter(r=>!map[r]),unused:P.comps.filter(c=>!used.has(c.id)&&!['gndsym','bus','joint','amp','shield'].includes(c.type))};
}
/* Seuls les simples Fender (Strat, Tele) sont inclinés au chevalet ; humbuckers et P90 restent droits */
const fenderSlant=c=>c.type==='single'&&['strat','tele'].includes(c.props.kind||'strat');
function applyRecipe(P,R,o={}){
  const {map,missing}=o.map?{map:{...o.map},missing:Object.keys(R.parts).filter(r=>!o.map[r])}:matchRecipe(P,R),ids=new Set(Object.values(map)),pol=[];
  if(o.replace!==false)P.wires=P.wires.filter(w=>!(ids.has(w.a.c)||ids.has(w.b.c)));
  const ox=o.ox||0,oy=o.oy||0;
  if(o.layout){const mv=Object.entries(map).map(([r,id])=>[r,P.comps.find(x=>x.id===id)]);mv.forEach(([r,c])=>{c.x=-1e6;c.y=-1e6;});mv.forEach(([r,c])=>{const [x,y]=R.L[r]||[0,0],sp=R.parts[r];if(TYPES[c.type].cat==='micro'){if(fenderSlant(c)){if(sp.rot&&!c.rot)c.rot=sp.rot;}else if(c.rot===10||c.rot===15)c.rot=0;}c.x=ox+x;c.y=oy+y;if(o.place)o.place(c,ox+x,oy+y);});}
  missing.forEach(r=>{const sp=R.parts[r],[x,y]=R.L[r]||[0,0],c=makeComp(sp.type,JSON.parse(JSON.stringify(sp.props)),ox+x,oy+y);if(sp.rot)c.rot=sp.rot;if(o.place)o.place(c,ox+x,oy+y);P.comps.push(c);map[r]=c.id;});
  Object.entries(map).forEach(([r,id])=>{const c=P.comps.find(x=>x.id===id),sp=R.parts[r];if(!c)return;
    if(TYPES[c.type].cat==='pot'&&sp.props.role)c.props.role=sp.props.role;
    if(TYPES[c.type].cat==='micro'&&sp.props.position)c.props.position=sp.props.position;
    /* Montage classique : le modèle fixe bobinage et aimant des simples (RWRP au milieu d’une Strat, au manche d’une Tele…) */
    if(c.type==='single'&&sp.type==='single'){const w=sp.props.winding||'std',m=sp.props.magnet||'S';if(c.props.winding!==w||c.props.magnet!==m){c.props.winding=w;c.props.magnet=m;pol.push(c.id);}}
    if(!c.props.name&&sp.props.name)c.props.name=sp.props.name;if(sp.props.use)c.props.use=sp.props.use;
    if(R.st&&R.st[r])Object.assign(c.state,R.st[r]);});
  const end=s=>{const [r,t]=s.split('.');return {c:map[r],t};};
  R.w.split('|').forEach(s=>{const [a,b,col]=s.trim().split(/\s+/);P.wires.push({id:uid('w'),a:end(a),b:end(b),color:col||null});});
  const hub=end(R.hubT||((R.hub||'V')+'.case'));
  R.g.split(/\s+/).filter(Boolean).forEach(s=>{const e=end(s);if(e.c===hub.c&&e.t===hub.t)return;P.wires.push({id:uid('w'),a:e,b:{...hub},color:null});});
  return {map,missing,pol};
}
function recipeProject(R){const P={id:uid('p'),v:1,meta:{name:R.label.split(',')[0],instrument:R.inst,notes:'Câblage : '+R.label+' ('+R.src+').'},comps:[],wires:[]};applyRecipe(P,R);return P;}

/* ===== Propositions de câblage selon la combinaison de micros =====
   Code lu du chevalet vers le manche, comme « HSS » : humbucker au chevalet, simple au milieu, simple au manche.
   H = double bobinage (humbucker 4 ou 2 conducteurs, actif) ; S = simple bobinage (Strat, Tele, P90).
   Les schémas standard sont fabriqués pour la combinaison demandée ; les schémas spéciaux (Megaswitch…) s’y ajoutent. */
const PU_H=new Set(['hb4','hb2','active']);
const puLetter=c=>PU_H.has(c.type)?'H':'S';
const POS_RANK={chevalet:0,milieu:1,manche:2};
const GUITAR_CODES=[['H','S'],['HH','HS','SH','SS'],['HHH','HHS','HSH','HSS','SHH','SHS','SSH','SSS']];
function guitarPickups(Pr){
  const ps=Pr.comps.filter(c=>TYPES[c.type].cat==='micro'&&c.type!=='pbass'&&c.props.kind!=='jbass'&&c.props.kind!=='bass');
  const distinct=new Set(ps.map(c=>c.props.position||'chevalet')).size===ps.length;
  return ps.slice().sort((a,b)=>distinct?POS_RANK[a.props.position||'chevalet']-POS_RANK[b.props.position||'chevalet']:(b.y-a.y)||(a.x-b.x));
}
const benchCode=Pr=>guitarPickups(Pr).map(puLetter).join('');
function puWord(sp){if(sp.type==='active')return 'actif';if(PU_H.has(sp.type))return 'humbucker';const k=sp.props.kind||'strat';return k==='p90'?'P90':k==='tele'?'simple Tele':k==='strat'?'simple Strat':'simple';}

/* Toutes les propositions pour une combinaison : schémas standard fabriqués, puis schémas spéciaux de même combinaison */

/* ===== Pièces en plus : les intégrer au câblage automatique =====

/* Une pièce en plus est-elle déjà câblée exactement comme la fonction le demande dans ce schéma ?

function modCoherent(P,c,role,eff,map,NW){
  if(!P.wires.some(w=>w.a.c===c.id||w.b.c===c.id))return false;
  const res=e=>{const [r,t]=e.split('.');const id=map[r];return id?[id,t]:null;},used=new Set();let checked=0;
  for(const seg of eff.w.split('|')){const [a,b]=seg.trim().split(/\s+/);if(!a||!b)continue;if(a.split('.')[0]!==role&&b.split('.')[0]!==role)continue;
    [a,b].forEach(e=>{if(e.split('.')[0]===role)used.add(e.split('.')[1]);});
    const A=res(a),B=res(b);if(!A||!B)continue;checked++;if(NW.net(...A)!==NW.net(...B))return false;}
  for(const e of eff.g.split(/\s+/)){if(e.split('.')[0]!==role)continue;used.add(e.split('.')[1]);checked++;if(!NW.gnd||NW.net(c.id,e.split('.')[1])!==NW.gnd)return false;}

}

/* Remplace la pièce `old` par une nouvelle (type + réglages), au même endroit, et reprend les fils qui peuvent l’être */
function swapPart(P,old,type,itemProps){

  if(old.props.name&&(T1.cat==='micro'||T1.cat==='pot'))props.name=old.props.name;

  const seeds=[];
  P.comps.forEach(c=>{const T=TYPES[c.type],r={shorts:[],res:[],caps:[]};if(T.internal)T.internal(c,stateOf(c,null),r);
    r.shorts.forEach(([a,b])=>{if(!isG(c.id,a)&&!isG(c.id,b))edges.push([K(c.id,a),K(c.id,b),T.cat==='pot'&&((a==='p2'&&b==='p3')||(a==='p3'&&b==='p2'))?c.id:null]);});

    const seen=new Set(seeds),q=[...seeds];while(q.length){const n=q.shift();(adj.get(n)||[]).forEach(m=>{if(!seen.has(m)){seen.add(m);q.push(m);}});}return seen;};

function wireAt(cx,cy){

function wireCtx(w){
  const cur=A.current,ground=!!cur.gnd&&cur.net(w.a.c,w.a.t)===cur.gnd;
  const P2={...P,wires:P.wires.filter(x=>x.id!==w.id)},st=analyzeState(P2,null);
  let inE=w.a,outE=w.b;
  if(st.tip&&st.net(w.a.c,w.a.t)===st.tip&&st.net(w.b.c,w.b.t)!==st.tip){inE=w.b;outE=w.a;}
  else if(!(st.tip&&st.net(w.b.c,w.b.t)===st.tip)){
    if(isPickupEnd(w.b)&&!isPickupEnd(w.a)){inE=w.b;outE=w.a;}
    else if(!isPickupEnd(w.a)&&!isPickupEnd(w.b)){const j=P.comps.find(c=>c.type==='jack'||c.type==='jack_st');if(j){const pa=termPos(w.a.c,w.a.t),pb=termPos(w.b.c,w.b.t);if(Math.hypot(pa.x-j.x,pa.y-j.y)<Math.hypot(pb.x-j.x,pb.y-j.y)){inE=w.b;outE=w.a;}}}
  }
  return {ground,inE,outE};

function groundTerm(p,exclude){

  P.comps.forEach(c=>{if(c.id===exclude||TYPES[c.type].cat==='micro')return;geom(c).terms.forEach(t=>{if(cur.net(c.id,t.id)!==cur.gnd)return;const d=Math.hypot(c.x+t.x-p.x,c.y+t.y-p.y)-(t.id==='case'?60:0);if(d<bd){bd=d;best={c:c.id,t:t.id};}});});
  return best;

  switch(t){
    case 'cap':return [{id:'series',label:'En série dans le fil',hint:'le fil est coupé et passe par le condensateur'},{id:'shunt',label:'Entre ce fil et la masse',hint:'filtre fixe : coupe les aigus en permanence'}];

pane.addEventListener('change',e=>{
  const t=e.target;

  if(t.matches('input[type=text],textarea')){if(pendingSnap&&pendingSnap!==snap())pushHist(pendingSnap);pendingSnap=null;if(t.matches('[data-prop]'))renderInsp();return;}
  if(t.matches('[data-prop]')){const c=byId(sel.id);const k=t.dataset.prop,v=t.type==='checkbox'?t.checked:t.value;commit(()=>{c.props[k]=v;if(k==='brand'){const tb=c.type==='hb4'?HB_BRANDS:c.type==='single'?SC_BRANDS:PB_BRANDS;if(tb[v]&&tb[v].c)c.props.colors=tb[v].c.slice();else if(v==='custom'&&!c.props.colors)c.props.colors=[];}});return;}
  if(t.matches('[data-rotin]')){const c=byId(sel.id),v=parseFloat(t.value)||0;commit(()=>{c.rot=((v%360)+360)%360;});return;}

pane.addEventListener('click',e=>{

  if(b.dataset.act==='vok'){const i=pane.querySelector('[data-vother]');if(i)applyVOther(i);return;}
  if(b.dataset.setval){const c=byId(sel.id);const v=b.dataset.setval;commit(()=>{c.props.value=v;});return;}
  if(b.dataset.act==='unA'||b.dataset.act==='unB'){const w=P.wires.find(x=>x.id===sel.id),k=b.dataset.act==='unA'?'a':'b';if(w&&w[k].c){const p=endPos(w[k]);commit(()=>{w[k]={c:null,t:null,x:Math.round(p.x+(p.dx||0)*40+18),y:Math.round(p.y+(p.dy??1)*40+18)};});toast('Fil débranché');}return;}
  if(b.dataset.rotby){rotateComp(sel.id,+b.dataset.rotby);return;}
  if(b.dataset.rotset!=null){const c=byId(sel.id);commit(()=>{c.rot=((+b.dataset.rotset%360)+360)%360;});return;}
  if(b.dataset.act==='rotl'){rotateComp(sel.id,-45);return;}
  if(b.dataset.act==='rotr'){rotateComp(sel.id,45);return;}
  if(b.dataset.act==='savepart'){const c=byId(sel.id);if(c)savePartDlg(c);return;}
  if(b.dataset.act==='addstock'){const q=Math.max(1,parseInt($('#sdQty').value)||1);const k=bomKey(stockDraft);if(!k){toast('Cette pièce ne se gère pas en stock');return;}const prev=STOCK[k]?STOCK[k].qty:0;STOCK[k]={label:bomLabel(stockDraft),qty:prev+q};LS.set('etabli.stock',STOCK);toast('Ajouté au stock');renderInsp();renderLib();return;}
  if(b.dataset.set!=null){cycleCtrl(sel.id,b.dataset.set,+b.dataset.val);return;}
  if(b.dataset.wcol){const w=P.wires.find(x=>x.id===sel.id);const v=b.dataset.wcol;commit(()=>{w.color=v==='auto'?null:v;});return;}
  if(b.dataset.issue!=null){const it=A.issues[+b.dataset.issue];if(it&&it.action){commit(()=>it.action.fn(P));toast('Modification appliquée');}return;}
  if(b.dataset.focus){focusComp(b.dataset.focus);return;}
  if(b.dataset.row!=null){const r=A.rows[+b.dataset.row];A.ctrls.forEach(({c,ct})=>{c.state[ct.key]=r.combo[c.id+'|'+ct.key];});A=analyze(P);render();renderInsp();saveSoon();return;}
});

function gFrame(){return `<div class="g-frame"><div class="g-fbox">${(()=>{const it=libAll().find(x=>x.label==='Simple Tele chevalet');return it?partThumb(it):'';})()}
  <span class="g-h g-h-rot">${gIco('rot',28)}</span><span class="g-h g-h-del">${gIco('del',28)}</span><span class="g-h g-h-swap">${gIco('swap',28)}</span></div>
  <ul class="g-legend"><li>${gIco('rot',22)} <b>Tourner</b> de 45° (touche R)</li><li>${gIco('del',22)} <b>Supprimer</b> la pièce (Suppr)</li><li>${gIco('swap',22)} <b>Interchanger</b> contre une pièce de la même famille</li></ul></div>`;}
function gWire(){return `<svg class="g-wsvg" viewBox="0 0 460 120" role="img" aria-label="Tirer un fil">
  <circle cx="70" cy="60" r="7" class="g-term"/><circle cx="70" cy="60" r="13" class="g-ring"/><text x="70" y="98" text-anchor="middle" class="g-s">cosse de départ</text>
  <path d="M70,60 C175,0 285,120 390,60" class="g-wire2"/><circle cx="230" cy="60" r="8" class="g-bend"/><text x="230" y="22" text-anchor="middle" class="g-s">poignée du fil : le courber</text>
  <circle cx="390" cy="60" r="7" class="g-term"/><circle cx="390" cy="60" r="13" class="g-ring"/><text x="390" y="98" text-anchor="middle" class="g-s">cosse d’arrivée</text></svg>`;}
function gScope(){let d='';for(let x=0;x<=300;x+=3){const y=50-30*Math.sin(x/18)*Math.exp(-x/420)-6*Math.sin(x/5.5);d+=(x?'L':'M')+x+','+y.toFixed(1);}
  return `<svg class="g-scope" viewBox="0 0 300 100" role="img" aria-label="Oscilloscope">${[1,2,3,4,5].map(i=>`<line x1="${i*50}" y1="0" x2="${i*50}" y2="100"/>`).join('')}${[1,2,3].map(i=>`<line x1="0" y1="${i*25}" x2="300" y2="${i*25}"/>`).join('')}<path d="${d}"/></svg>`;}
const gCodes=()=>`<div class="g-codes">${['H','S','HS','SS','HSS','HSH','SSS'].map(c=>`<span>${c}</span>`).join('')}</div>`;
const gKey=k=>`<kbd>${k}</kbd>`;
const GUIDE=[
 ['ecran','L’écran',()=>`${gMap()}
  <ol class="g-ol"><li><b>Barre du haut</b> : modèles, type d’instrument, annuler / rétablir, câblage automatique, projets, enregistrement, thème clair ou sombre, fiche d’atelier.</li>
  <li><b>Bibliothèque</b> : toutes les pièces, classées par famille, avec recherche et favoris.</li>
  <li><b>L’établi</b> : le plan de câblage, à l’échelle (la règle « 1 cm » le rappelle).</li>
  <li><b>Vous entendez</b> : les micros qui sonnent dans la position actuelle.</li>
  <li><b>Positions</b> : les positions des sélecteurs et switchs, à toucher pour les essayer.</li>
  <li><b>Barre du bas</b> : masses en fils ou en symboles, fond tapis ou papier, zoom, « Ajuster » pour tout voir.</li>
  <li><b>Panneau de droite</b> : réglages de la pièce choisie, analyse, stock, oscilloscope et multimètre.</li>
  <li><b>État du circuit</b> : « Circuit cohérent » ou le nombre d’erreurs et de conseils ; un toucher ouvre l’analyse.</li></ol>
  <p>Les boutons en haut à gauche de l’établi masquent la bibliothèque, le panneau de droite, ou passent en plein écran.</p>`],
 ['projet','Démarrer un projet',()=>`<p><b>Partir d’un modèle</b> (Strat, HSS, Les Paul, Tele, EMG, Jazz Bass, P-Bass…) pose et câble un instrument complet, prêt à modifier. Choisissez d’abord <b>Guitare</b> ou <b>Basse</b> : la bibliothèque, les schémas et les sons s’adaptent.</p>
  <p>Le panneau de droite, sans pièce sélectionnée, montre la fiche du projet : nom, client, instrument (modèle, numéro de série), statut et notes d’atelier.</p>
  <p><b>Projets</b> retrouve tous vos travaux, avec recherche par client ou instrument. Ils sont enregistrés automatiquement sur cet appareil. <b>Enregistrer</b> crée en plus un fichier <code>.json</code> à ranger où vous voulez, ou à envoyer à un collègue. La <b>sauvegarde complète</b> réunit projets, pièces personnelles, modèles et stock en un seul fichier : faites-en une de temps en temps, et avant de changer d’appareil.</p>
  <p>Un montage réussi peut devenir votre propre modèle : <b>Projets → Enregistrer comme modèle</b>.</p>`],
 ['pieces','Poser et régler les pièces',()=>`<p>Touchez une pièce de la bibliothèque pour la poser, ou faites-la glisser à l’endroit voulu. Le bouton à côté de la recherche replie ou déplie toutes les familles ; l’étoile range une pièce dans vos <b>Favoris</b>.</p>
  <div class="g-row">${gThumb('Simple bobinage Strat')}${gThumb('Humbucker 4 conducteurs')}${gThumb('Simple Tele chevalet')}</div>
  <p>Touchez une pièce posée pour la sélectionner : un cadre pointillé apparaît avec trois poignées.</p>${gFrame()}
  <p>Le panneau <b>Pièce</b> règle tout ce qui compte pour le câblage : nom, <b>marque</b> (qui fixe le code couleur des fils), position sur l’instrument, nombre de cordes, valeur et courbe des potentiomètres, modèle des condensateurs.</p>
  <p>Sur les micros, chaque plot porte son pôle : <span class="g-pole g-n2">N</span> rouge pour nord, <span class="g-pole g-s2">S</span> bleu pour sud. Le petit repère à côté de la bobine indique le sens du bobinage (<b>std</b> ou <b>RW</b>, inversé). Sur un humbucker, les vis et les plots sont dessinés différemment, et chaque bobine affiche le trajet de ses fils.</p>`],
 ['cabler','Câbler à la main',()=>`<p>Tirez un fil depuis une cosse jusqu’à une autre : les cosses s’entourent de cuivre quand vous approchez.</p>${gWire()}
  <ul class="g-ul"><li><b>Courber un fil</b> : sélectionnez-le et tirez sa poignée, pour aérer le plan.</li>
  <li><b>Insérer une pièce sur un fil</b> : faites-la glisser sur le fil, il s’allume en cuivre. Au relâchement, l’établi la branche dans le bon sens : un volume prend l’entrée sur la cosse 3 et la sortie sur la 2, une tonalité reçoit son condensateur vers la masse.</li>
  <li><b>Masses : fils ou symboles</b> (barre du bas) : les retours à la masse peuvent être dessinés comme des fils ou remplacés par le symbole ⏚, plus lisible.</li>
  <li><b>Blindage cuivre</b> (famille « Connectique et masse ») : un rectangle de cuivre sous les pièces, à redimensionner par ses coins. Les potentiomètres et switchs posés dessus prennent leur masse par le cuivre. L’établi signale alors les fils de masse en double, qui créent des boucles de masse, et le jack posé sur le cuivre.</li></ul>`],
 ['auto','Câblage automatique',()=>`<p><b>Câblage auto</b> reconnaît la combinaison de vos micros, lue du chevalet vers le manche : H pour humbucker, S pour simple (Strat, Tele, P90).</p>${gCodes()}
  <p>Il propose les schémas qui lui correspondent : Fender (sélecteur à lame), Gibson (toggle, deux volumes), Schaller Megaswitch, variantes avec split. Le plus proche de votre établi est signalé. Vous pouvez aussi choisir une autre combinaison pour la préparer.</p>
  <p><b>Il câble avec les pièces posées et ne rajoute rien sans demander.</b> Avant de câbler, il pose les questions utiles :</p>
  <ul class="g-ul"><li><b>Pièce manquante</b> : ajouter une pièce neuve, remplacer une pièce présente, ou câbler sans (une tonalité, par exemple).</li>
  <li><b>Pièce en plus</b> : quel rôle lui donner ? Un kill switch devient un coupe-son ; un mini-switch peut faire un split, une inversion de phase, une mise en série ; un condensateur peut faire un treble bleed. Sinon : la laisser non câblée ou la supprimer.</li>
  <li><b>Règles d’atelier</b> : volume en courbe A (log), tonalité en B (linéaire), valeur d’usage selon les micros (250 kΩ pour des simples, 500 kΩ pour des humbuckers, 25 kΩ pour des actifs). Pour chaque potentiomètre hors règle : conserver ou remplacer.</li></ul>
  <p>Une pièce déjà bien câblée n’est pas redemandée. Le bouton « Câbler l’établi » reste grisé tant qu’une question attend sa réponse. Tout se défait d’un coup avec ${gKey('Ctrl')}+${gKey('Z')}.</p>`],
 ['swap','Interchanger une pièce',()=>`<p>Pour faire évoluer un instrument, sélectionnez la pièce et touchez la poignée ${gIco('swap',22)} en bas à droite du cadre. Le panneau de droite présente, en miniatures, les pièces de la même famille : micros, potentiomètres (dont push-pull et point milieu), sélecteurs (lame, toggle, Megaswitch), switchs, condensateurs, jacks, préamplis.</p>
  <p>Touchez la nouvelle pièce : elle prend la place de l’ancienne, garde son nom et sa position, et les fils sont repris quand les cosses se correspondent. Si le câblage doit changer (sélecteur différent, humbucker à la place d’un simple…), l’établi recâble dans la foulée, ou ouvre le câblage automatique s’il faut répondre à une question, comme le rôle du switch d’un push-pull.</p>`],
 ['verifier','Vérifier le circuit',()=>`<p>Touchez l’étiquette noire d’un sélecteur ou d’un push-pull, ou utilisez la barre <b>Positions</b> : le trajet du signal s’allume en cuivre, et les micros muets pâlissent. L’encadré <b>Vous entendez</b> nomme ce qui sonne : « ∥ » pour des micros en parallèle, « en série » pour des micros en série.</p>
  <p>L’onglet <b>Analyse</b> passe toutes les positions en revue et classe ce qu’il trouve :</p>
  <ul class="g-ul"><li><b>Erreurs</b> : court-circuit, aucun son, cosse indispensable non câblée.</li>
  <li><b>Avertissements</b> : micros hors phase, position muette, boucle de masse, pile non reliée.</li>
  <li><b>Conseils</b> : codes couleur à confirmer, courbe ou valeur de potentiomètre, treble bleed possible…</li></ul>
  <p>Chaque ligne désigne la pièce concernée sur l’établi, et propose souvent la correction en un bouton. Pour la position en cours, il indique aussi le niveau, la phase, la tonalité active et le <b>bruit de fond</b> : présent, réduit ou annulé (humbucking).</p>`],
 ['ecouter','Écouter et mesurer',()=>`${gScope()}<p>L’onglet <b>Oscillo</b> fait entendre l’instrument tel qu’il est câblé : accord ouvert, accord de puissance, note seule ou arpège, avec la position et les potentiomètres actuels. Ajoutez un <b>amplificateur de test</b> (il se branche seul sur le jack) pour choisir le son de l’ampli et la longueur du câble. L’oscilloscope montre le <b>signal</b> dans le temps, ou la <b>réponse</b> en fréquence : de quoi comparer une tonalité, un treble bleed ou deux valeurs de condensateur. Deux sondes se posent sur n’importe quelle cosse.</p>
  <p>« Verrouiller sur l’oscilloscope » ne garde à l’écran que l’oscilloscope et les commandes de l’instrument : pratique sur iPad pour comparer les positions.</p>
  <p>L’onglet <b>Multimètre</b> mesure, comme au banc, la résistance ou la continuité (avec le bip) entre deux cosses. Il donne surtout les <b>valeurs attendues au jack</b>, à comparer avec votre vrai multimètre avant de refermer l’instrument.</p>`],
 ['atelier','Préparer l’atelier',()=>`<p>L’onglet <b>Stock</b> liste les pièces à prévoir pour le projet. Indiquez ce que vous avez à l’atelier : l’établi calcule ce qu’il faut commander. Le stock vaut pour tous vos projets.</p>
  <p>La <b>Fiche d’atelier</b> réunit sur une page le schéma, la liste numérotée des soudures (à cocher au fil du travail), le son de chaque position et les pièces. Imprimez-la, enregistrez-la en PDF ou téléchargez-la : elle se pose à côté du fer.</p>`],
 ['raccourcis','Raccourcis clavier',()=>`<table class="t g-keys"><tbody>
  ${[['Ctrl+Z / Ctrl+Y','annuler, rétablir'],['Ctrl+S','enregistrer'],['Ctrl+O','ouvrir'],['Ctrl+D','dupliquer la pièce'],['Suppr','supprimer la sélection'],['R / Maj+R','tourner de 45°'],['B','masquer la bibliothèque'],['D','masquer le panneau de droite'],['F','plein écran'],['Molette, pincement','zoomer'],['Glisser le fond','se déplacer']].map(([k,v])=>`<tr><td>${k.split(/( \/ |, )/).map(x=>/ \/ |, /.test(x)?x:x.split('+').map(gKey).join('+')).join('')}</td><td>${v}</td></tr>`).join('')}
  </tbody></table><p class="muted">Sur iPad : touchez pour sélectionner, faites glisser pour déplacer, pincez pour zoomer, faites glisser le fond de l’établi pour vous déplacer.</p>`],
 ['faq','Questions fréquentes',()=>`<dl class="g-faq">
  <dt>Mes projets sont-ils en sécurité ?</dt><dd>Ils sont enregistrés automatiquement sur cet appareil, mais pas ailleurs. Pour les garder ou changer d’appareil, faites une <b>sauvegarde complète</b> (Projets), ou enregistrez chaque projet en fichier.</dd>
  <dt>Pourquoi « codes couleur à confirmer » ?</dt><dd>Les couleurs des fils changent selon les marques et les séries. Choisissez la marque dans le panneau Pièce, et vérifiez la notice du micro : en cas de doute, la notice a raison.</dd>
  <dt>Deux micros ensemble sonnent creux.</dt><dd>Ils sont hors phase : un bobinage ou un aimant est inversé. L’analyse le signale ; corrigez le bobinage (std / RW) ou l’aimant (N / S), ou inversez chaud et froid d’un des micros.</dd>
  <dt>Le câblage automatique me pose beaucoup de questions.</dt><dd>Il ne touche à rien sans votre accord. Les boutons « Ajouter toutes les pièces manquantes » et « Remplacer tous les potentiomètres hors règle » répondent en une fois.</dd>
  <dt>Puis-je câbler à ma façon, hors des schémas ?</dt><dd>Oui : tout peut se câbler à la main, et l’analyse vérifie n’importe quel montage. Les schémas ne sont qu’un point de départ.</dd>
  <dt>Le son de l’oscilloscope est-il celui de ma guitare ?</dt><dd>C’est une simulation électrique fidèle du câblage (micros, potentiomètres, condensateurs, câble, ampli). Elle compare très bien deux montages, mais ne remplace pas l’écoute de l’instrument fini.</dd>
  <dt>Comment retrouver cette aide ?</dt><dd>Touchez le logo en haut à gauche, puis « Guide utilisateur ».</dd></dl>`]
];
function guideDlg(start){
  openDlg('Guide utilisateur',`<div class="guide"><nav class="g-toc" aria-label="Sommaire">${GUIDE.map(([id,t],i)=>`<button data-g="${id}"><span>${i+1}</span>${esc(t)}</button>`).join('')}</nav>
    <div class="g-body" id="gBody">${GUIDE.map(([id,t,f],i)=>`<section class="g-sec" id="g-${id}"><h3><span>${i+1}</span>${esc(t)}</h3>${f()}</section>`).join('')}</div></div>`,
    `<button class="btn" data-x="gwelcome">Retour à l’accueil</button><button class="btn primary" data-d="close">Fermer le guide</button>`);
  dlg.classList.add('wide','guide-dlg');
  const body=$('#gBody'),toc=dlg.querySelectorAll('.g-toc button');
  const mark=()=>{let cur=GUIDE[0][0];GUIDE.forEach(([id])=>{const el=$('#g-'+id);if(el&&el.offsetTop-body.offsetTop<=body.scrollTop+40)cur=id;});toc.forEach(b=>b.setAttribute('aria-current',String(b.dataset.g===cur)));};
  body.addEventListener('scroll',mark,{passive:true});mark();
  dlg.querySelector('.g-toc').addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b)return;const el=$('#g-'+b.dataset.g);if(el)body.scrollTo({top:el.offsetTop-body.offsetTop-6,behavior:'smooth'});});
  if(start){const el=$('#g-'+start);if(el)body.scrollTop=el.offsetTop-body.offsetTop-6;}
}

function fbField(f){const v=FB.v[f.k]??(f.type==='check'?f.def:f.type==='seg'||f.type==='select'?'':'');const id='fb_'+f.k;

  const fields=c.fields.filter(f=>f.type!=='check').map(f=>[f.l,String(FB.v[f.k]||'').trim()]).filter(x=>x[1]);

async function fbSend(){
  if(fbMissing().length)return;const d=fbPayload();FB.state='sending';FB.err='';fbSync();
  const url=EKLIS.feedback||(/^https?:$/.test(location.protocol)&&!/claude/.test(location.hostname)?'contact.php':'');
  try{if(!url)throw new Error('le service d’envoi n’est pas encore en place sur ce poste.');
    const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),20000);
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(d),signal:ctl.signal});clearTimeout(tm);
    let j=null;try{j=await r.json();}catch(_){}
    if(!r.ok||!j||!j.ok)throw new Error(j&&j.error?j.error:r.status===404?'le service d’envoi n’est pas encore installé chez l’hébergeur.':'le serveur a répondu par une erreur ('+r.status+').');
    FB.state='sent';fbRender();toast('Merci, votre retour est bien parti !');
  }catch(e){FB.state='form';FB.err=e.name==='AbortError'?'le serveur ne répond pas.':/fetch|network|load/i.test(e.message)?'pas de connexion Internet, ou service injoignable.':e.message;fbRender();const er=dlg.querySelector('.fb-err');if(er)er.scrollIntoView({behavior:'smooth',block:'nearest'});}
}

function readProjectText(txt,handle){
  const d=JSON.parse(txt);
  if(d.kind==='etabli-backup'){restoreBackup(d);return;}
  if(!Array.isArray(d.comps)||!Array.isArray(d.wires))throw 0;
  delete d.kind;delete d.saved;d.comps=d.comps.filter(c=>TYPES[c.type]);
  d.id=d.id||uid('p');
  saveNow();loadProject(migrateProject(d));if(handle){FH.set(P.id,handle);P.meta.file=handle.name;}
  dlg.close();toast('Projet ouvert : '+(P.meta.name||'sans nom'));
}
async function openProjectFile(){
  if(window.showOpenFilePicker){
    try{const [h]=await window.showOpenFilePicker({types:[{description:'Projet Établi électronique',accept:{'application/json':['.json']}}]});const f=await h.getFile();readProjectText(await f.text(),h);return;}
    catch(e){if(e&&e.name==='AbortError')return;if(e===0||e instanceof SyntaxError){toast('Fichier non reconnu : il faut un projet de l’Établi');return;}}
  }
  $('#fileIn').click();
}
function backupData(){return JSON.stringify({kind:'etabli-backup',v:2,saved:new Date().toISOString(),projects:Object.values(LS.get('etabli.projects',{})).map(p=>p.data),favs:FAVS,parts:UPARTS,templates:UTPLS,brands:USER_BRANDS,stock:STOCK},null,1);}
function restoreBackup(d){
  const all=LS.get('etabli.projects',{});let n=0;
  (d.projects||[]).forEach(p=>{if(p&&Array.isArray(p.comps)){migrateProject(p);all[p.id]={id:p.id,name:p.meta.name,client:p.meta.client||'',updated:Date.now(),data:p};n++;}});
  LS.set('etabli.projects',all);
  (d.parts||[]).forEach(p=>{if(TYPES[p.type]&&!UPARTS.some(x=>x.id===p.id))UPARTS.push(p);});
  (d.templates||[]).forEach(t=>{if(!UTPLS.some(x=>x.id===t.id))UTPLS.push(t);});
  (d.favs||[]).forEach(f=>{if(!FAVS.includes(f))FAVS.push(f);});
  (d.brands||[]).forEach(b=>{if(!USER_BRANDS.some(x=>x.id===b.id))USER_BRANDS.push(b);});
  Object.entries(d.stock||{}).forEach(([k,v])=>{if(!STOCK[k])STOCK[k]=v;});
  saveParts();saveTpls();saveFavs();saveBrands();LS.set('etabli.stock',STOCK);renderLib();renderTplSel();projectsDlg();toast(`Sauvegarde restaurée : ${n} projet(s)`);
}
function clientNames(){return [...new Set(Object.values(LS.get('etabli.projects',{})).map(p=>(p.data&&p.data.meta&&p.data.meta.client||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'));}

  <p class="muted" style="margin-top:12px">Les projets restent aussi enregistrés automatiquement dans ce navigateur. « Enregistrer » crée un fichier à ranger où vous voulez ; la sauvegarde complète regroupe tous les projets, préréglages et le stock en un seul fichier.</p>`,
  `<button class="btn" data-x="open">Ouvrir un fichier…</button><button class="btn" data-x="backup">Sauvegarde complète</button><button class="btn" data-d="svg">Exporter le schéma (.svg)</button><button class="btn" data-p="newtpl">Enregistrer comme modèle</button><button class="btn primary" data-d="new">Nouveau projet vierge</button>`);

function renderPlist(){
  const all=Object.values(LS.get('etabli.projects',{})).sort((a,b)=>b.updated-a.updated),q=norm(PQ.trim());
  const fmt=t=>new Date(t).toLocaleDateString('fr-FR',{dateStyle:'medium'});
  const list=all.filter(p=>{const m=(p.data&&p.data.meta)||{};return !q||norm([m.name,m.client,m.guitar,m.notes].join(' ')).includes(q);});
  const groups=new Map();list.forEach(p=>{const c=((p.data.meta||{}).client||'').trim()||'Sans client';if(!groups.has(c))groups.set(c,[]);groups.get(c).push(p);});
