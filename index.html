function paneOsc(){
  const cfg=simCfg(),amp=ampOf(),j=jackOf(),linked=amp&&ampLinked(),inst=P.meta.instrument||'guitare',lock=document.body.classList.contains('osclock');
  const pus=P.comps.filter(c=>TYPES[c.type].cat==='micro');
  const soundSel=`<select data-osel="sound" aria-label="Son de test">${soundGroups(inst).map(([gl,items])=>`<optgroup label="${esc(gl)}">${items.map(([k,l])=>`<option value="${k}"${cfg.sound===k?' selected':''}>${esc(l)}</option>`).join('')}</optgroup>`).join('')}${['emaj','power','arp','tap'].includes(cfg.sound)||/^s\d$/.test(cfg.sound)?'':`<option value="${esc(cfg.sound)}" selected>${esc(soundName(cfg.sound,inst))}</option>`}</select>`;
  const tapSel=cfg.sound==='tap'?`<div class="row"><span>Micro testé</span><select data-osel="tap" aria-label="Micro testé">${pus.map(c=>`<option value="${c.id}"${cfg.tap===c.id?' selected':''}>${esc(displayName(c))}</option>`).join('')}</select></div>`:'';
  const seg=(items,cur,key)=>`<div class="okseg">${items.map(([k,l,t])=>`<button data-sc="${key}:${k}" aria-pressed="${cur===k}"${t?` title="${esc(t)}"`:''}>${l}</button>`).join('')}</div>`;
  const ampModes=`<div class="seg">${[['clair','Clair'],['crunch','Crunch'],['sature','Saturé']].map(([k,l])=>`<button data-oamp="${k}" aria-pressed="${(amp?amp.props.mode:'clair')===k}"${amp?'':' disabled'}>${l}</button>`).join('')}</div>`;
  const ampSec=!amp?`<p style="margin:0 0 8px">Sans amplificateur sur l’établi, l’écoute se fait en son clair avec un câble de 3 m. Ajoutez un amplificateur de test pour choisir le son et le câble : il se branche tout seul sur le jack.</p><button class="btn primary small" data-oact="addamp"${j?'':' disabled'}>Ajouter un amplificateur</button>${j?'':'<p class="muted">Il faut d’abord un jack de sortie sur l’établi.</p>'}`
    :`${linked?'':`<p class="vb-w" style="margin:0 0 8px">L’ampli n’est pas relié à la pointe et à la masse du jack : vous n’entendrez que ce qui arrive sur ses bornes.</p><button class="btn small" data-oact="relink" style="margin-bottom:8px">Rebrancher l’ampli sur le jack</button>`}
      <div class="ocrl"><div class="row"><span>Son de l’ampli</span>${ampModes}</div><p class="lvl" style="margin:-2px 0 0 112px">${esc(AMP_DESC[amp.props.mode]||'')}</p>
      <div class="row"><span>Câble</span><select data-ocable>${[['1','1 m'],['3','3 m'],['6','6 m'],['10','10 m']].map(([k,l])=>`<option value="${k}"${String(amp.props.cable)===k?' selected':''}>${l}</option>`).join('')}</select></div></div>`;
  return `<section class="osc-sec scope-sec"><div class="osc-h"><h3>Oscilloscope</h3><div class="seg mini olh"><button data-oview="wave" aria-pressed="${cfg.view!=='resp'}">Signal</button><button data-oview="resp" aria-pressed="${cfg.view==='resp'}">Réponse</button></div>
      <button class="lockbtn" data-oact="lock" aria-pressed="${lock}" title="${lock?'Déverrouiller : retrouver tous les onglets':'Verrouiller : seulement l’oscilloscope et les commandes de l’instrument'}" aria-label="${lock?'Déverrouiller':'Verrouiller sur l’oscilloscope'}">${lock?ICO.lock:ICO.unlock}</button></div>
    <canvas id="scope" aria-label="Écran de l’oscilloscope"></canvas>
    <div class="okeys"><button class="okey run${SCOPE.run?'':' stop'}" data-sc="run" title="Figer ou relancer l’affichage">${SCOPE.run?'RUN':'STOP'}</button><button class="okey" data-sc="auto" title="Réglage automatique de l’échelle">AUTO</button>
      ${seg([['auto','Auto','Affiche en continu, même sans déclenchement'],['normal','Normal','N’affiche que quand le signal franchit le niveau'],['single','Single','Capture une seule fois puis s’arrête']],cfg.tmode,'mode')}
      ${seg([['up','↑','Déclenchement sur front montant'],['down','↓','Déclenchement sur front descendant']],cfg.edge,'edge')}</div>
    <div class="osteps"><div class="ostep"><button data-sc="v-" aria-label="Moins de volts par division">−</button><output><small>Volts/div</small><span id="oVd">${vdTxt(cfg)}</span></output><button data-sc="v+" aria-label="Plus de volts par division">+</button></div>
      <div class="ostep"><button data-sc="t-" aria-label="Base de temps plus rapide">−</button><output><small>Temps/div</small><span id="oTd">${tdTxt(cfg)}</span></output><button data-sc="t+" aria-label="Base de temps plus lente">+</button></div>
      <div class="ostep"><button data-sc="l-" aria-label="Baisser le niveau de déclenchement">▼</button><output><small>Niveau</small><span id="oTl">${tlTxt(cfg)}</span></output><button data-sc="l+" aria-label="Monter le niveau de déclenchement">▲</button></div></div>
    <div id="oscPhase">${phaseHTML()}</div>
    <div class="oread olh" id="oscRead">${readHTML()}</div>
    ${tapSel?`<div class="ocrl" style="margin-top:8px">${tapSel}</div>`:''}
    <div class="transport">${soundSel.replace('<select ','<select class="tsel" ')}<button class="tbtn" id="tPlay" data-oact="play" aria-pressed="${SIM.playing&&!SIM.loop}" title="Jouer">${ICO.play}<span class="tl">Jouer</span></button><button class="tbtn" id="tLoop" data-oact="loop" aria-pressed="${SIM.playing&&SIM.loop}" title="En boucle">${ICO.loop}<span class="tl">En boucle</span></button><button class="tbtn" data-oact="stop" title="Arrêter">${ICO.stop}<span class="tl">Arrêter</span></button>
      <div class="slider ovol" title="Volume d’écoute"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg><input type="range" min="0" max="1" step="0.02" value="${LS.get('etabli.vol',0.7)}" data-mvol aria-label="Volume d’écoute"></div></div>
    ${cfg.sound==='tap'?'<p class="lvl olh" style="margin-top:6px">Conseil : 100 à 200 ms par division (mode défilant) pour voir l’approche et le retrait sur le même écran, ou Single pour figer l’impulsion.</p>':/^s\d$/.test(cfg.sound)?'':'<p class="lvl olh" style="margin-top:6px">Une corde seule donne une courbe plus lisible qu’un accord.</p>'}
  </section>
  <section class="osc-sec"><h3>Commandes de l’instrument</h3>${ctrlsHTML()}<p class="lvl olh" style="margin-top:6px">Tout se recalcule pendant l’écoute.</p></section>
  <section class="osc-sec olh"><h3>Ampli de test</h3>${ampSec}</section>
  <section class="osc-sec olh"><h3>Sondes</h3>${probeRow('ch1','1',CH_COL[0],'#1b1b1b','Aucune',true)}${probeRow('ch2','2',CH_COL[1],'#1b1b1b','Aucune',true)}
    <p class="lvl" style="margin-top:6px">Posez CH1 sur le chaud d’un micro et CH2 sur le chaud d’un autre, ou au jack, pour comparer. L’icône de repère permet de toucher la cosse directement sur l’établi.</p></section>
  <section class="osc-sec olh"><h3>Polarité des micros</h3><div id="oscPol">${polHTML()}</div></section>
  <p class="lvl olh">Estimation calculée à partir du circuit : les erreurs de câblage (phase, split, masse, positions, charge des potentiomètres, tonalité) sont fiables ; le timbre exact d’un modèle de micro, du bois ou de l’ampli reste approximatif. Les micros utilisent des valeurs typiques tant que leur résistance et leur inductance ne sont pas renseignées dans l’onglet Pièce.</p>`;
}
function paneMM(){
  const cfg=simCfg();
  return `<section class="osc-sec"><h3>Multimètre</h3>
    <div class="seg" style="margin:0 0 8px"><button data-ommode="ohm" aria-pressed="${cfg.mmode==='ohm'}">Résistance</button><button data-ommode="cont" aria-pressed="${cfg.mmode==='cont'}">Continuité (bip)</button></div>
    <div id="mmDisp">${meterHTML()}</div>
    ${probeRow('mp','+','#d33a2c','#fff','Choisir un point',false)}${probeRow('mc','−','#222','#fff','Choisir un point',false)}
    <p class="lvl" style="margin-top:6px">Ampli débranché, comme au banc. L’icône de repère permet de toucher la cosse directement sur l’établi.</p></section>
  <section class="osc-sec"><h3>Valeurs attendues au jack</h3><p class="lvl">Mesure entre pointe et masse du jack, potentiomètres dans leur position actuelle. Comparez avec votre multimètre avant de refermer l’instrument.</p><div id="mmTable">${tableHTML()}</div></section>`;
}
function setOscLock(on){
  keepCenter(()=>document.body.classList.toggle('osclock',on));LS.set('etabli.osclock',on);
  if(on){tab='osc';if(innerWidth>900&&document.body.classList.contains('noinsp'))setNoInsp(false);}
  renderInsp();setTimeout(()=>{fitScope();drawScope();},60);
}
function setProbe(k,v){const cfg=simCfg();cfg[k]=v;saveSoon();
  if(k==='mp'||k==='mc'){SIM.wasCont=false;simMeasure();updOscUI();}
  render();if(tab==='osc'||tab==='mm'){const sl=pane.querySelector(`[data-osel="${k}"]`);if(sl)sl.value=v;}
}
function probesSVG(){
  if((tab!=='osc'&&tab!=='mm')||!P)return '';const cfg=simCfg(),amp=ampOf(),j=jackOf();
  const list=tab==='osc'?[['ch1','1',CH_COL[0],'#1b1b1b',-22],['ch2','2',CH_COL[1],'#1b1b1b',22]]:[['mp','+','#d33a2c','#fff',-22],['mc','−','#222','#fff',22]];
  return list.map(([k,l,col,tc,dx])=>{
    let v=cfg[k];if(v==='out')v=amp?amp.id+'|tip':j?j.id+'|tip':null;if(!v)return '';const [c,t]=v.split('|');if(!byId(c))return '';const p=termPos(c,t);if(!p)return '';
    const ox=p.x+dx,oy=p.y-30;
    return `<g class="probe"><line x1="${p.x.toFixed(1)}" y1="${p.y.toFixed(1)}" x2="${ox.toFixed(1)}" y2="${oy.toFixed(1)}" stroke="${col}" stroke-width="2.6"/><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="8" fill="none" stroke="${col}" stroke-width="2.6"/><circle cx="${ox.toFixed(1)}" cy="${oy.toFixed(1)}" r="11" fill="${col}" stroke="rgba(0,0,0,.35)"/><text x="${ox.toFixed(1)}" y="${(oy+4.6).toFixed(1)}" text-anchor="middle" fill="${tc}">${l}</text></g>`;
  }).join('');
}
pane.addEventListener('click',e=>{
  if(tab!=='osc'&&tab!=='mm')return;const b=e.target.closest('button');if(!b)return;
  if(b.dataset.oact){const a=b.dataset.oact;
    if(a==='addamp')addAmp();else if(a==='relink'){const amp=ampOf();commit(()=>connectAmp(P,amp));toast('Ampli rebranché sur le jack');}
    else if(a==='play')simPlay(false);else if(a==='loop')simLoopBtn();else if(a==='stop')simStop();
    else if(a==='lock')setOscLock(!document.body.classList.contains('osclock'));return;}
  if(b.dataset.sc){scAct(b.dataset.sc);return;}
  if(b.dataset.oamp){const amp=ampOf();if(amp)commit(()=>{amp.props.mode=b.dataset.oamp;});return;}
  if(b.dataset.oview){simCfg().view=b.dataset.oview;saveSoon();pane.querySelectorAll('[data-oview]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));drawScope();return;}
  if(b.dataset.ommode){simCfg().mmode=b.dataset.ommode;saveSoon();pane.querySelectorAll('[data-ommode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));updOscUI();return;}
  if(b.dataset.opick){const k=b.dataset.opick;SIM.pick=SIM.pick===k?null:k;pane.querySelectorAll('[data-opick]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.opick===SIM.pick)));
    if(SIM.pick){toast('Touchez une cosse sur l’établi pour y poser la sonde');closeDrawers();}return;}
  if(b.dataset.octl){const [cid,key,i]=b.dataset.octl.split('|');cycleCtrl(cid,key,+i);return;}
});
pane.addEventListener('change',e=>{
  if(tab!=='osc'&&tab!=='mm')return;const t=e.target;
  if(t.dataset.osel){const k=t.dataset.osel;if(k==='ch1'||k==='ch2'||k==='mp'||k==='mc')return setProbe(k,t.value);
    const cfg=simCfg();cfg[k]=t.value;saveSoon();
    if(k==='sound'||k==='tap'){SCOPE.frozen=null;SCOPE.run=true;SIM.autoNext=true;if(k==='sound')renderInsp();}
    SIM.sig='';simCheck();return;}
  if(t.matches('[data-ocable]')){const amp=ampOf();if(amp)commit(()=>{amp.props.cable=t.value;});}
});
pane.addEventListener('input',e=>{
  if(tab!=='osc'&&tab!=='mm')return;const t=e.target;
  if(t.dataset.oslide){const [cid,key]=t.dataset.oslide.split('|'),c=byId(cid);if(!c)return;const v=snapLvl(c,key,+t.value);if(v!==+t.value)t.value=v;c.state[key]=v;const o=pane.querySelector(`[data-oout="${cid}"]`);if(o)o.textContent=fmtLvl(v);A=analyze(P);render();saveSoon();return;}
  if(t.matches('[data-mvol]')){const v=+t.value;LS.set('etabli.vol',v);if(SIM.nodes)SIM.nodes.master.gain.value=v;}
});
if(LS.get('etabli.osclock',false)){document.body.classList.add('osclock');tab='osc';}

/* Bibliothèque masquable et plein écran */
function keepCenter(fn){
  const r0=svg.getBoundingClientRect(),cx=(r0.width/2-view.x)/view.k,cy=(r0.height/2-view.y)/view.k;fn();
  requestAnimationFrame(()=>{const r=svg.getBoundingClientRect();view.x=r.width/2-cx*view.k;view.y=r.height/2-cy*view.k;applyView();});
}
function syncPanelBtns(){
  const nl=document.body.classList.contains('nolib'),ni=document.body.classList.contains('noinsp');
  const lb=$('#libBtn'),ib=$('#inspBtn');
  lb.setAttribute('aria-pressed',String(nl));let t=nl?'Afficher la bibliothèque (B)':'Masquer la bibliothèque (B)';lb.title=t;lb.setAttribute('aria-label',t.replace(' (B)',''));
  ib.setAttribute('aria-pressed',String(ni));t=ni?'Afficher le panneau de droite (D)':'Masquer le panneau de droite (D)';ib.title=t;ib.setAttribute('aria-label',t.replace(' (D)',''));
}
const inFS=()=>document.body.classList.contains('fs');
function setNoLib(on,save=true){
  if(innerWidth<=900&&save){$('#lib').classList.contains('open')?closeDrawers():openDrawer('lib');return;}
  keepCenter(()=>document.body.classList.toggle('nolib',on));syncPanelBtns();
  if(save&&!inFS())LS.set('etabli.nolib',on);
}
function setNoInsp(on,save=true){
  if(innerWidth<=900&&save){$('#insp').classList.contains('open')?closeDrawers():openDrawer('insp');return;}
  keepCenter(()=>document.body.classList.toggle('noinsp',on));syncPanelBtns();
  if(save&&!inFS())LS.set('etabli.noinsp',on);
  if(!on&&(tab==='osc'))setTimeout(()=>{fitScope();drawScope();},60);
}
/* Plein écran : seule la barre du haut disparaît. Les panneaux gardent leur état et s’ouvrent ou se ferment par leurs boutons.
   Sur iPad, Safari pose une grosse croix en haut à gauche : la barre d’outils de l’établi descend pour rester accessible. */
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement||null;
/* Installé sur l’écran d’accueil de l’iPad : l’app occupe déjà tout l’écran, sans barre d’adresse. Le mode plein écran se limite alors à masquer la barre d’outils, sans appeler le plein écran de Safari (qui se fermait au moindre geste). */
const IOS_APP=navigator.standalone===true||(matchMedia('(display-mode: standalone)').matches&&(navigator.maxTouchPoints||0)>1&&/Mac|iP/.test(navigator.platform||''));
if(IOS_APP)document.documentElement.classList.add('ios-app');
function relayout(){
  ['#insp','#lib'].forEach(sl=>{const el=$(sl);if(!el)return;const d=el.style.display;el.style.display='none';void el.offsetHeight;el.style.display=d;});
  if(tab==='osc'){fitScope();drawScope();}
}
function relayoutSoon(){[60,350,900].forEach(t=>setTimeout(relayout,t));}
function syncNativeFS(){document.body.classList.toggle('nfs-touch',!!fsEl()&&(navigator.maxTouchPoints||0)>0);}
function setFS(on){
  if(on===inFS())return;
  keepCenter(()=>document.body.classList.toggle('fs',on));
  syncPanelBtns();
  const b=$('#fsBtn');b.setAttribute('aria-pressed',String(on));const t=on?'Quitter le plein écran (F ou Échap)':'Plein écran (F)';b.title=t;b.setAttribute('aria-label',on?'Quitter le plein écran':'Plein écran');
  const de=document.documentElement;
  if(!IOS_APP)try{if(on&&!fsEl()){const r=de.requestFullscreen||de.webkitRequestFullscreen;if(r){const pr=r.call(de);if(pr&&pr.catch)pr.catch(()=>{});}}
    else if(!on&&fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;if(x){const pr=x.call(document);if(pr&&pr.catch)pr.catch(()=>{});}}}catch(_){}
  if(on)closeDrawers();
  syncNativeFS();relayoutSoon();
}
$('#libBtn').onclick=()=>setNoLib(!document.body.classList.contains('nolib'));
$('#inspBtn').onclick=()=>setNoInsp(!document.body.classList.contains('noinsp'));
$('#fsBtn').onclick=()=>setFS(!inFS());
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{syncNativeFS();if(!fsEl()&&inFS())setFS(false);relayoutSoon();}));
if(innerWidth>900){if(LS.get('etabli.nolib',false))setNoLib(true,false);if(LS.get('etabli.noinsp',false))setNoInsp(true,false);}
syncPanelBtns();
document.addEventListener('keydown',e=>{
  const tg=e.target;if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT'||tg.isContentEditable)||e.ctrlKey||e.metaKey||e.altKey||dlg.open)return;
  if(e.key==='f'||e.key==='F'){e.preventDefault();setFS(!inFS());}
  else if(e.key==='b'||e.key==='B'){e.preventDefault();setNoLib(!document.body.classList.contains('nolib'));}
  else if(e.key==='d'||e.key==='D'){e.preventDefault();setNoInsp(!document.body.classList.contains('noinsp'));}
  else if(e.key==='Escape'&&inFS()&&!sel)setFS(false);
});

/* Démarrage */
document.head.insertAdjacentHTML('beforeend',`<style>${FICHE_CSS}</style>`);
renderLib();
(function start(){
  const all=LS.get('etabli.projects',{}),cur=LS.get('etabli.current',null);
  if(cur&&all[cur])loadProject(all[cur].data);
  else loadProject(recipeProject(recipeById('sss_fender')));
  $('#stageWm').innerHTML=eklisLogo('wm','');$('#aboutBtn').onclick=aboutDlg;
  if(!LS.get('etabli.nowelcome',false))setTimeout(aboutDlg,250);
})();
let rsT=0;addEventListener('resize',()=>{if(innerWidth>900)closeDrawers();clearTimeout(rsT);rsT=setTimeout(()=>{if(tab==='osc'){fitScope();drawScope();}},120);});
</script>
<script>
if('serviceWorker' in navigator&&window.isSecureContext&&location.protocol!=='file:')addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
</script>
